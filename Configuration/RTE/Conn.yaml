# Based on EXT:rte_ckeditor/Configuration/RTE/Full.yaml, but imports its
# building blocks instead of Full.yaml itself: TYPO3's YAML imports append
# lists, so lists like heading.options could never be replaced or reordered
# on top of Full.yaml.
imports:
    - { resource: 'EXT:rte_ckeditor/Configuration/RTE/Processing.yaml' }
    - { resource: 'EXT:rte_ckeditor/Configuration/RTE/Editor/Base.yaml' }
    - { resource: 'EXT:rte_ckeditor/Configuration/RTE/Editor/Plugins.yaml' }

editor:
    config:
        contentsCss:
            - 'EXT:conn_t3wtk_base/Resources/Public/Css/main.css'

        style:
            definitions:
                # Heading sizes — keep the semantic tag, borrow another level's look
                # (e.g. <h1 class="h2">). Mutually exclusive via ExclusiveStyles.
                - { name: 'H1 styled as H2', element: 'h1', classes: ['h2'] }
                - { name: 'H1 styled as H3', element: 'h1', classes: ['h3'] }
                - { name: 'H1 styled as H4', element: 'h1', classes: ['h4'] }
                - { name: 'H1 styled as H5', element: 'h1', classes: ['h5'] }
                - { name: 'H2 styled as H1', element: 'h2', classes: ['h1'] }
                - { name: 'H2 styled as H3', element: 'h2', classes: ['h3'] }
                - { name: 'H2 styled as H4', element: 'h2', classes: ['h4'] }
                - { name: 'H2 styled as H5', element: 'h2', classes: ['h5'] }
                - { name: 'H3 styled as H1', element: 'h3', classes: ['h1'] }
                - { name: 'H3 styled as H2', element: 'h3', classes: ['h2'] }
                - { name: 'H3 styled as H4', element: 'h3', classes: ['h4'] }
                - { name: 'H3 styled as H5', element: 'h3', classes: ['h5'] }
                - { name: 'H4 styled as H1', element: 'h4', classes: ['h1'] }
                - { name: 'H4 styled as H2', element: 'h4', classes: ['h2'] }
                - { name: 'H4 styled as H3', element: 'h4', classes: ['h3'] }
                - { name: 'H4 styled as H5', element: 'h4', classes: ['h5'] }
                - { name: 'H5 styled as H1', element: 'h5', classes: ['h1'] }
                - { name: 'H5 styled as H2', element: 'h5', classes: ['h2'] }
                - { name: 'H5 styled as H3', element: 'h5', classes: ['h3'] }
                - { name: 'H5 styled as H4', element: 'h5', classes: ['h4'] }
                - { name: 'Quote / Citation', element: 'blockquote' }
                - { name: 'Code block', element: 'code' }
                # Inline styles
                - { name: 'Yellow marker', element: 'span', classes: ['yellow-marker'] }
                # Bootstrap buttons — only offered when the cursor is inside a link.
                # Mutually exclusive via ExclusiveStyles (any style with class `btn`).
                - { name: 'Button primary', element: 'a', classes: ['btn', 'btn-primary'] }
                - { name: 'Button secondary', element: 'a', classes: ['btn', 'btn-secondary'] }
                - { name: 'Button success', element: 'a', classes: ['btn', 'btn-success'] }
                - { name: 'Button danger', element: 'a', classes: ['btn', 'btn-danger'] }
                - { name: 'Button warning', element: 'a', classes: ['btn', 'btn-warning'] }
                - { name: 'Button info', element: 'a', classes: ['btn', 'btn-info'] }
                - { name: 'Button light', element: 'a', classes: ['btn', 'btn-light'] }
                - { name: 'Button dark', element: 'a', classes: ['btn', 'btn-dark'] }
                - { name: 'Button outline primary', element: 'a', classes: ['btn', 'btn-outline-primary'] }
                - { name: 'Button outline secondary', element: 'a', classes: ['btn', 'btn-outline-secondary'] }
                - { name: 'Button outline success', element: 'a', classes: ['btn', 'btn-outline-success'] }
                - { name: 'Button outline danger', element: 'a', classes: ['btn', 'btn-outline-danger'] }
                - { name: 'Button outline warning', element: 'a', classes: ['btn', 'btn-outline-warning'] }
                - { name: 'Button outline info', element: 'a', classes: ['btn', 'btn-outline-info'] }
                - { name: 'Button outline light', element: 'a', classes: ['btn', 'btn-outline-light'] }
                - { name: 'Button outline dark', element: 'a', classes: ['btn', 'btn-outline-dark'] }

        heading:
            options:
                - { model: 'paragraph', title: 'Paragraph' }
                - { model: 'heading1', view: 'h1', title: 'Heading 1' }
                - { model: 'heading2', view: 'h2', title: 'Heading 2' }
                - { model: 'heading3', view: 'h3', title: 'Heading 3' }
                - { model: 'heading4', view: 'h4', title: 'Heading 4' }
                - { model: 'heading5', view: 'h5', title: 'Heading 5' }
                - { model: 'formatted', view: 'pre', title: 'Pre-Formatted Text' }

        toolbar:
            items:
                - removeFormat
                - undo
                - redo
                # grouping separator
                - '|'
                - findAndReplace
                - link
                - '|'
                - insertTable
                - tableColumn
                - tableRow
                - mergeTableCells
                - TableProperties
                - TableCellProperties
                - '|'
                - selectAll
                - '|'
                - sourceEditing
                - showBlocks
                - horizontalLine
                # line break
                - '-'
                - bold
                - italic
                - underline
                - strikethrough
                - subscript
                - superscript
                - softhyphen
                - '|'
                - bulletedList
                - numberedList
                - blockQuote
                - indent
                - outdent
                - alignment
                - '|'
                - specialCharacters
                - '-'
                - style
                - heading
                - fontFamily
                - fontBackgroundColor
                - fontColor
                - fontSize
                - textPartLanguage
                - highlight
                - highlight:greenMarker
                - '|'
                - fullscreen
                - emoji

        alignment:
            options:
                - { name: 'left', className: 'text-start' }
                - { name: 'center', className: 'text-center' }
                - { name: 'right', className: 'text-end' }
                - { name: 'justify', className: 'text-justify' }

        table:
            defaultHeadings: { rows: 1 }
            contentToolbar:
                - tableColumn
                - tableRow
                - mergeTableCells
                - tableProperties
                - tableCellProperties
                - toggleTableCaption

        fontColor:
            colors:
                - { label: 'Orange', color: '#ff8700' }
                - { label: 'Blue', color: '#0080c9' }
                - { label: 'Green', color: '#209d44' }

        fontBackgroundColor:
            colors:
                - { label: 'Stage orange light', color: '#fab85c' }

        fontFamily:
            options:
                - 'default'
                - 'Arial, sans-serif'

        # Relative sizes (em) scale with the surrounding text, e.g. a smaller
        # "RX" inside a fluid H1 stays proportional on every screen size.
        # Fixed sizes (numbers = px) stay the same on every screen size.
        fontSize:
            options:
                - 'default'
                - { title: '50 %', model: '0.5em', view: { name: 'span', styles: { font-size: '0.5em' } } }
                - { title: '60 %', model: '0.6em', view: { name: 'span', styles: { font-size: '0.6em' } } }
                - { title: '70 %', model: '0.7em', view: { name: 'span', styles: { font-size: '0.7em' } } }
                - { title: '80 %', model: '0.8em', view: { name: 'span', styles: { font-size: '0.8em' } } }
                - { title: '90 %', model: '0.9em', view: { name: 'span', styles: { font-size: '0.9em' } } }
                - { title: '110 %', model: '1.1em', view: { name: 'span', styles: { font-size: '1.1em' } } }
                - { title: '120 %', model: '1.2em', view: { name: 'span', styles: { font-size: '1.2em' } } }
                - { title: '130 %', model: '1.3em', view: { name: 'span', styles: { font-size: '1.3em' } } }
                - { title: '140 %', model: '1.4em', view: { name: 'span', styles: { font-size: '1.4em' } } }
                - { title: '150 %', model: '1.5em', view: { name: 'span', styles: { font-size: '1.5em' } } }
                - 12
                - 14
                - 16
                - 18
                - 21
                - 24
                - 28
                - 32
                - 48
                - 60

        list:
            properties:
                styles: true
                startIndex: true
                reversed: true

        indentBlock:
            classes:
                - 'ps-2'
                - 'ps-3'
                - 'ps-4'

        language:
            textPartLanguage:
                - { title: 'English', languageCode: 'en' }
                - { title: 'French', languageCode: 'fr' }
                - { title: 'German', languageCode: 'de' }

        highlight:
            options:
                - { model: 'yellowMarker', class: 'marker-yellow', title: 'Yellow marker', type: 'marker', color: 'var(--ck-content--highlight-marker-yellow)' }
                - { model: 'greenMarker', class: 'marker-green', title: 'Green marker', type: 'marker', color: 'var(--ck-content-highlight-marker-green)' }
                - { model: 'redPen', class: 'pen-red', title: 'Red pen', type: 'pen', color: 'var(--ck-content-highlight-pen-red)' }

        mention:
            feeds:
                -
                    marker: '@'
                    feed:
                        - '@TYPO3'
                    minimumCharacters: 1

        importModules:
            - { module: '@ckeditor/ckeditor5-word-count', exports: ['WordCount'] }
            # Provides fontFamily, fontSize, fontColor, and fontBackgroundColor toolbar items
            - { module: '@ckeditor/ckeditor5-font', exports: ['Font'] }
            # Provides showBlocks toolbar item
            - { module: '@ckeditor/ckeditor5-show-blocks', exports: ['ShowBlocks'] }
            # Provides textPartLanguage toolbar item
            - { module: '@ckeditor/ckeditor5-language', exports: ['TextPartLanguage'] }
            - { module: '@ckeditor/ckeditor5-mention', exports: ['Mention'] }
            - { module: '@ckeditor/ckeditor5-highlight', exports: ['Highlight'] }
            - { module: '@ckeditor/ckeditor5-list', exports: ['ListProperties'] }
            - { module: '@ckeditor/ckeditor5-fullscreen', exports: ['Fullscreen'] }
            - { module: '@typo3/conn-t3wtk-base/CKEditor/ckeditor5-emoji.js', exports: ['Emoji'] }
            - { module: '@typo3/conn-t3wtk-base/CKEditor/exclusive-styles.js', exports: ['ExclusiveStyles'] }

        # Presence of this key (even empty) is the marker the
        # ResolveEmojiDefinitionsUrl event listener checks for — it fills in
        # definitionsUrl at runtime with an absolute URL to the self-hosted
        # dataset, so the backend never calls cdn.ckeditor.com.
        emoji: {}

        # textPartLanguage only tags a lang="" attribute on the selection for
        # a11y/spell-check — no visible effect, which read as broken to editors.
        removePlugins:
            - TextPartLanguage

allowedOptions: 'target,title,class'

buttons:
    link:
        properties:
            class:
                required: false
                # Whole class strings — the link browser matches the link's class
                # attribute exactly, so button values carry both `btn` and the variant.
                allowedClasses:
                    - 'link-external'
                    - 'link-file'
                    - 'link-pdf'
                    - 'link-email'
                    - 'btn btn-primary'
                    - 'btn btn-secondary'
                    - 'btn btn-success'
                    - 'btn btn-danger'
                    - 'btn btn-warning'
                    - 'btn btn-info'
                    - 'btn btn-light'
                    - 'btn btn-dark'
                    - 'btn btn-outline-primary'
                    - 'btn btn-outline-secondary'
                    - 'btn btn-outline-success'
                    - 'btn btn-outline-danger'
                    - 'btn btn-outline-warning'
                    - 'btn btn-outline-info'
                    - 'btn btn-outline-light'
                    - 'btn btn-outline-dark'

classes:
    link-external:
        name: 'External link'
    link-file:
        name: 'Download'
    link-pdf:
        name: 'PDF'
    link-email:
        name: 'Email'
    'btn btn-primary':
        name: 'Button primary'
    'btn btn-secondary':
        name: 'Button secondary'
    'btn btn-success':
        name: 'Button success'
    'btn btn-danger':
        name: 'Button danger'
    'btn btn-warning':
        name: 'Button warning'
    'btn btn-info':
        name: 'Button info'
    'btn btn-light':
        name: 'Button light'
    'btn btn-dark':
        name: 'Button dark'
    'btn btn-outline-primary':
        name: 'Button outline primary'
    'btn btn-outline-secondary':
        name: 'Button outline secondary'
    'btn btn-outline-success':
        name: 'Button outline success'
    'btn btn-outline-danger':
        name: 'Button outline danger'
    'btn btn-outline-warning':
        name: 'Button outline warning'
    'btn btn-outline-info':
        name: 'Button outline info'
    'btn btn-outline-light':
        name: 'Button outline light'
    'btn btn-outline-dark':
        name: 'Button outline dark'
