categories:
  # ═══ STANDARD — global theme/color/system settings, not tied to a page area ═══
  conn.standard:
    label: 'Standard'
  conn.theme:
    label: 'Theme & Colors'
    parent: conn.standard
  conn.theme.color:
    label: 'Color'
    description: 'The base color scheme — used as-is (this is also what light mode renders, since light is the default theme). Override any of these for dark mode only under "Dark-theme coloring".'
    parent: conn.theme
  conn.theme.dark:
    label: 'Dark-theme coloring'
    description: 'Per-setting overrides applied only when dark mode is active. Leave a setting empty here to keep using its Color value in dark mode too.'
    parent: conn.theme
  conn.theme.shape:
    label: 'Shape'
    description: 'Corner rounding shared by every element and Bootstrap component. Elements with a "Border radius" option of their own can still override it.'
    parent: conn.theme
  conn.theme.buttons:
    label: 'Button colors'
    description: 'Colors for the Bootstrap button variants that have no theme design of their own (success, danger, warning, info, light, dark — filled and outline). Leave a setting empty to keep the Bootstrap 5 default. Primary and secondary buttons follow the accent/surface colors above.'
    parent: conn.theme
  conn.meta:
    label: 'Meta & Analytics'
    parent: conn.standard
  conn.advanced:
    label: 'Advanced'
    parent: conn.standard
  fsc:
    label: 'Fluid Styled Content'
    parent: conn.advanced
  fsc.templates:
    label: 'Templates'
    description: 'Global Fluid override paths shipped by fluid_styled_content. In conn projects these are superseded by the package layering (conn_t3kit_base → conn_t3kit_elements → sitepackage) — leave all three empty and override templates in the sitepackage instead.'
    parent: fsc
  fsc.content:
    label: 'Content Elements'
    description: 'Rendering options for the standard content elements (Text, Text & Media, Images, Insert Records, …).'
    parent: fsc

  # ═══ HEADER AREA — navbar, theme toggle, branding/logo ═══
  conn.header:
    label: 'Header area'
  conn.navbar:
    label: 'Navbar'
    parent: conn.header
  conn.navbar.top:
    label: 'NavTop'
    parent: conn.navbar
  conn.navbar.panel:
    label: 'Panel (NavLeft / NavRight / mobile)'
    parent: conn.navbar
  conn.navbar.colors:
    label: 'Navbar – Colors'
    parent: conn.navbar
  conn.themetoggle:
    label: 'Theme toggle'
    parent: conn.header
  conn.branding:
    label: 'Branding'
    parent: conn.header

  # ═══ FOOTER AREA ═══
  conn.footer:
    label: 'Footer area'
  conn.footer.colors:
    label: 'Footer – Colors'
    parent: conn.footer
  conn.footer.typography:
    label: 'Footer – Typography'
    parent: conn.footer
  conn.footer.grid:
    label: 'Footer – Grid'
    parent: conn.footer
  conn.footer.bar:
    label: 'Footer – Bottom bar'
    parent: conn.footer
  conn.footer.navigation:
    label: 'Footer – Navigation'
    parent: conn.footer
  conn.footer.barNavigation:
    label: 'Footer – Bottom bar navigation'
    parent: conn.footer

  # ═══ Standalone top-level areas (not nested under Footer, even though they
  # currently only render there — kept independently findable per project
  # decision, in case they're reused outside the footer later) ═══
  conn.contact:
    label: 'Contact Information'
  conn.social:
    label: 'Social Media'

settings:

  # ══ STANDARD — global theme/color/system settings ═════════════════════════

  # ─── Color (light / base — used as-is, dark mode below overrides it) ──────
  # CSS var(s) (ThemeVarsProcessor): --conn-accent, --bs-primary
  theme.light.accent:
    label: 'Accent color'
    description: 'Primary brand/accent color. Any CSS color value (e.g. #6366f1, rgb(99,102,241)). Leave empty to keep the built-in default. Overridden per-setting by "Dark-theme coloring" below when set.'
    type: string
    default: ''
    category: conn.theme.color

  # CSS var (ThemeVarsProcessor): --conn-accent-hover
  theme.light.accentHover:
    label: 'Accent – hover'
    description: 'Accent color on hover/focus. Leave empty to keep the built-in default.'
    type: string
    default: ''
    category: conn.theme.color

  # CSS var (ThemeVarsProcessor): --conn-accent-secondary
  theme.accentSecondary:
    label: 'Accent secondary'
    description: 'Secondary accent color used in card hover gradients and highlights (e.g. #06b6d4). Leave empty to keep the built-in default.'
    type: string
    default: ''
    category: conn.theme.color

  # CSS var (ThemeVarsProcessor): --conn-accent-soft
  theme.light.accentSoft:
    label: 'Accent soft background'
    description: 'Low-opacity accent fill used for active stat cards, tag badges, and hover backgrounds (e.g. rgba(99, 102, 241, 0.1)). Leave empty to keep the built-in default.'
    type: string
    default: ''
    category: conn.theme.color

  # CSS var (ThemeVarsProcessor): --conn-accent-glow
  theme.light.accentGlow:
    label: 'Accent glow'
    description: 'Medium-opacity accent used for glows and subtle highlights (e.g. rgba(99, 102, 241, 0.2)). Leave empty to keep the built-in default.'
    type: string
    default: ''
    category: conn.theme.color

  # CSS var(s) (ThemeVarsProcessor): --conn-bg, --bs-body-bg
  theme.light.bg:
    label: 'Page background'
    description: 'Page background color for light mode.'
    type: string
    default: ''
    category: conn.theme.color

  # CSS var(s) (ThemeVarsProcessor): --conn-surface, --conn-surface-alt, --conn-surface-raised
  theme.light.surface:
    label: 'Surface color'
    description: 'Card / panel surface color for light mode.'
    type: string
    default: ''
    category: conn.theme.color

  # CSS var(s) (ThemeVarsProcessor): --conn-text, --bs-body-color
  theme.light.text:
    label: 'Text color'
    description: 'Main body text color for light mode.'
    type: string
    default: ''
    category: conn.theme.color

  # CSS var(s) (ThemeVarsProcessor): --conn-heading, --bs-heading-color
  theme.light.heading:
    label: 'Headers color'
    description: 'Heading (h1–h6) color for light mode.'
    type: string
    default: ''
    category: conn.theme.color

  # CSS var(s) (ThemeVarsProcessor): --conn-emphasis, --bs-emphasis-color
  theme.light.emphasis:
    label: 'Emphasis color'
    description: 'Strong/bold text and emphasis color for light mode.'
    type: string
    default: ''
    category: conn.theme.color

  # CSS var(s) (ThemeVarsProcessor): --conn-link, --bs-link-color
  theme.light.link:
    label: 'Link color'
    description: 'Hyperlink color for light mode.'
    type: string
    default: ''
    category: conn.theme.color

  # CSS var(s) (ThemeVarsProcessor): --conn-link-hover, --bs-link-hover-color
  theme.light.linkHover.text:
    label: 'Link – hover color'
    description: 'Hyperlink text color on hover/focus for light mode.'
    type: string
    default: ''
    category: conn.theme.color

  # CSS var (ThemeVarsProcessor): --conn-link-hover-underline
  theme.light.linkHover.underline:
    label: 'Link – hover underline color'
    description: 'Color of the animated underline effect (see "Animated underline on link hover") for light mode. Falls back to the link hover color when empty.'
    type: string
    default: ''
    category: conn.theme.color

  # Not resolved by ThemeVarsProcessor — this is a feature toggle, not a color/size.
  # Consumed in Page.typoscript (bodyTagCObject) to append the "link-hover-underline"
  # body class; the actual CSS lives in conn_t3kit_base's link-hover-effect partial/SCSS.
  theme.linkHoverEffect:
    label: 'Animated underline on link hover'
    description: 'Grows an underline in from the left under links on hover, using the link/link-hover colors.'
    type: bool
    default: false
    category: conn.theme.color

  # CSS var(s) (ThemeVarsProcessor): --conn-text-muted, --bs-secondary-color
  theme.light.textMuted:
    label: 'Muted text color'
    description: 'Secondary / muted text color for light mode.'
    type: string
    default: ''
    category: conn.theme.color

  # CSS var (ThemeVarsProcessor): --conn-border
  theme.light.border:
    label: 'Border color'
    description: 'Default border color for light mode.'
    type: string
    default: ''
    category: conn.theme.color

  # CSS var (ThemeVarsProcessor): --conn-border-strong
  theme.light.borderStrong:
    label: 'Border color – strong'
    description: 'Stronger border color used for hover states, active dropdowns, and focus rings (e.g. rgba(99, 102, 241, 0.28)). Leave empty to keep the built-in default.'
    type: string
    default: ''
    category: conn.theme.color

  # CSS var (ThemeVarsProcessor): --conn-btn-bg
  theme.light.btnBg:
    label: 'Button background'
    description: 'Primary button background color for light mode (e.g. #6366f1). Leave empty to use the accent color.'
    type: string
    default: ''
    category: conn.theme.color

  # CSS var (ThemeVarsProcessor): --conn-btn-bg-hover
  theme.light.btnBgHover:
    label: 'Button background – hover'
    description: 'Primary button background color on hover/active for light mode. Leave empty to use the accent hover color.'
    type: string
    default: ''
    category: conn.theme.color

  # CSS var (ThemeVarsProcessor): --conn-btn-color
  theme.light.btnColor:
    label: 'Button text color'
    description: 'Text (label) color on primary buttons for light mode (e.g. #ffffff). Leave empty to keep white.'
    type: string
    default: ''
    category: conn.theme.color

  # CSS var (ThemeVarsProcessor): --conn-sh-color
  theme.shadowHover.color:
    label: 'Card hover shadow – color'
    description: 'Shadow color including opacity. Any CSS color with alpha, e.g. rgb(99 102 241 / 22%) or rgba(99,102,241,0.22). Leave empty to keep the built-in default.'
    type: string
    default: ''
    category: conn.theme.color

  # CSS var (ThemeVarsProcessor): --conn-sh-blur
  theme.shadowHover.blur:
    label: 'Card hover shadow – blur radius'
    description: 'Blur radius of the hover shadow, e.g. 32px. Leave empty to keep the built-in default (32px).'
    type: string
    default: ''
    category: conn.theme.color

  # CSS var (ThemeVarsProcessor): --conn-sh-y
  theme.shadowHover.offsetY:
    label: 'Card hover shadow – vertical offset'
    description: 'Vertical offset of the hover shadow, e.g. 8px. Leave empty to keep the built-in default (8px).'
    type: string
    default: ''
    category: conn.theme.color

  # CSS var (ThemeVarsProcessor): --conn-sh-x
  theme.shadowHover.offsetX:
    label: 'Card hover shadow – horizontal offset'
    description: 'Horizontal offset of the hover shadow, e.g. 0. Leave empty to keep the built-in default (0).'
    type: string
    default: ''
    category: conn.theme.color

  # CSS var (ThemeVarsProcessor): --conn-sh-spread
  theme.shadowHover.spread:
    label: 'Card hover shadow – spread radius'
    description: 'Spread radius of the hover shadow, e.g. 4px. Leave empty to keep the built-in default (0).'
    type: string
    default: ''
    category: conn.theme.color

  # CSS var (ThemeVarsProcessor): --conn-radius-scale — multiplies every
  # --conn-radius* and --bs-border-radius* token (theme/_tokens.scss).
  theme.radius:
    label: 'Corner radius'
    description: 'Rounding of cards, images, galleries, panels, badges and Bootstrap components (buttons, inputs, dropdowns, modals, …). "None" gives square corners everywhere. Circles (avatars, dots, round icon buttons) stay round. An element''s own "Border radius" option, other than "Theme default", overrides this.'
    type: string
    default: default
    enum:
      none: 'None (square corners)'
      small: 'Small'
      default: 'Default'
      large: 'Large'
      xlarge: 'Extra large'
    category: conn.theme.shape

  # ─── Dark-theme coloring (overrides Color above, dark mode only) ──────────
  # CSS var(s) (ThemeVarsProcessor): --conn-accent, --bs-primary
  theme.dark.accent:
    label: 'Accent color'
    description: 'Accent color for dark mode. Overrides the Color setting above. Leave empty to use that value.'
    type: string
    default: ''
    category: conn.theme.dark

  # CSS var (ThemeVarsProcessor): --conn-accent-hover
  theme.dark.accentHover:
    label: 'Accent – hover'
    description: 'Accent hover color for dark mode. Leave empty to use the global value.'
    type: string
    default: ''
    category: conn.theme.dark

  # CSS var (ThemeVarsProcessor): --conn-accent-soft
  theme.dark.accentSoft:
    label: 'Accent soft background'
    description: 'Low-opacity accent fill for dark mode (e.g. rgba(99, 102, 241, 0.15)). Leave empty to keep the built-in default.'
    type: string
    default: ''
    category: conn.theme.dark

  # CSS var (ThemeVarsProcessor): --conn-accent-glow
  theme.dark.accentGlow:
    label: 'Accent glow'
    description: 'Medium-opacity accent glow for dark mode (e.g. rgba(99, 102, 241, 0.3)). Leave empty to keep the built-in default.'
    type: string
    default: ''
    category: conn.theme.dark

  # CSS var(s) (ThemeVarsProcessor): --conn-bg, --bs-body-bg
  theme.dark.bg:
    label: 'Page background'
    description: 'Page background color for dark mode.'
    type: string
    default: ''
    category: conn.theme.dark

  # CSS var(s) (ThemeVarsProcessor): --conn-surface, --conn-surface-alt, --conn-surface-raised
  theme.dark.surface:
    label: 'Surface color'
    description: 'Card / panel surface color for dark mode.'
    type: string
    default: ''
    category: conn.theme.dark

  # CSS var(s) (ThemeVarsProcessor): --conn-text, --bs-body-color
  theme.dark.text:
    label: 'Text color'
    description: 'Main body text color for dark mode.'
    type: string
    default: ''
    category: conn.theme.dark

  # CSS var(s) (ThemeVarsProcessor): --conn-heading, --bs-heading-color
  theme.dark.heading:
    label: 'Headers color'
    description: 'Heading (h1–h6) color for dark mode.'
    type: string
    default: ''
    category: conn.theme.dark

  # CSS var(s) (ThemeVarsProcessor): --conn-emphasis, --bs-emphasis-color
  theme.dark.emphasis:
    label: 'Emphasis color'
    description: 'Strong/bold text and emphasis color for dark mode.'
    type: string
    default: ''
    category: conn.theme.dark

  # CSS var(s) (ThemeVarsProcessor): --conn-link, --bs-link-color
  theme.dark.link:
    label: 'Link color'
    description: 'Hyperlink color for dark mode.'
    type: string
    default: ''
    category: conn.theme.dark

  # CSS var(s) (ThemeVarsProcessor): --conn-link-hover, --bs-link-hover-color
  theme.dark.linkHover.text:
    label: 'Link – hover color'
    description: 'Hyperlink text color on hover/focus for dark mode.'
    type: string
    default: ''
    category: conn.theme.dark

  # CSS var (ThemeVarsProcessor): --conn-link-hover-underline
  theme.dark.linkHover.underline:
    label: 'Link – hover underline color'
    description: 'Color of the animated underline effect (see "Animated underline on link hover") for dark mode. Falls back to the link hover color when empty.'
    type: string
    default: ''
    category: conn.theme.dark

  # CSS var(s) (ThemeVarsProcessor): --conn-text-muted, --bs-secondary-color
  theme.dark.textMuted:
    label: 'Muted text color'
    description: 'Secondary / muted text color for dark mode.'
    type: string
    default: ''
    category: conn.theme.dark

  # CSS var (ThemeVarsProcessor): --conn-border
  theme.dark.border:
    label: 'Border color'
    description: 'Default border color for dark mode.'
    type: string
    default: ''
    category: conn.theme.dark

  # CSS var (ThemeVarsProcessor): --conn-border-strong
  theme.dark.borderStrong:
    label: 'Border color – strong'
    description: 'Stronger border color for hover states and focus rings in dark mode (e.g. rgba(255, 255, 255, 0.15)). Leave empty to keep the built-in default.'
    type: string
    default: ''
    category: conn.theme.dark

  # CSS var (ThemeVarsProcessor): --conn-btn-bg
  theme.dark.btnBg:
    label: 'Button background'
    description: 'Primary button background color for dark mode. Leave empty to use the accent color.'
    type: string
    default: ''
    category: conn.theme.dark

  # CSS var (ThemeVarsProcessor): --conn-btn-bg-hover
  theme.dark.btnBgHover:
    label: 'Button background – hover'
    description: 'Primary button background color on hover/active for dark mode. Leave empty to use the accent hover color.'
    type: string
    default: ''
    category: conn.theme.dark

  # CSS var (ThemeVarsProcessor): --conn-btn-color
  theme.dark.btnColor:
    label: 'Button text color'
    description: 'Text (label) color on primary buttons for dark mode. Leave empty to keep white.'
    type: string
    default: ''
    category: conn.theme.dark

  # ─── Button colors (Bootstrap variants) ───────────────────────────────────

  # Override rules (ThemeVarsProcessor): .btn-success, .btn-outline-success
  theme.light.btnSuccessBg:
    label: 'Success button – color'
    description: 'Background of filled and border/text of outline "success" buttons. Hover/active shades are derived automatically. Leave empty to keep the Bootstrap default (#198754).'
    type: string
    default: ''
    category: conn.theme.buttons

  # Override rules (ThemeVarsProcessor): .btn-success, .btn-outline-success
  theme.light.btnSuccessColor:
    label: 'Success button – text color'
    description: 'Label color on filled "success" buttons (and on outline ones while hovered). Leave empty to keep the Bootstrap default.'
    type: string
    default: ''
    category: conn.theme.buttons

  # Override rules (ThemeVarsProcessor): [data-bs-theme="dark"] .btn-success, .btn-outline-success
  theme.dark.btnSuccessBg:
    label: 'Success button – color (dark)'
    description: 'Dark-mode variant. Falls back to the success button color above when empty.'
    type: string
    default: ''
    category: conn.theme.buttons

  # Override rules (ThemeVarsProcessor): [data-bs-theme="dark"] .btn-success, .btn-outline-success
  theme.dark.btnSuccessColor:
    label: 'Success button – text color (dark)'
    description: 'Dark-mode variant. Falls back to the success button text color above when empty.'
    type: string
    default: ''
    category: conn.theme.buttons

  # Override rules (ThemeVarsProcessor): .btn-danger, .btn-outline-danger
  theme.light.btnDangerBg:
