    default: 'copyright'
    category: conn.footer.bar
    enum:
      copyright: 'Copyright'
      social: 'Social links'
      navigation: 'Navigation (inline)'
      brand: 'Brand'
      brandTagline: 'Brand & tagline'
      tagline: 'Tagline'
      '': 'Empty'

  footer.bar.center:
    label: 'Bottom bar – Center slot'
    type: string
    default: ''
    category: conn.footer.bar
    enum:
      copyright: 'Copyright'
      social: 'Social links'
      navigation: 'Navigation (inline)'
      brand: 'Brand'
      brandTagline: 'Brand & tagline'
      tagline: 'Tagline'
      '': 'Empty'

  footer.bar.right:
    label: 'Bottom bar – Right slot'
    type: string
    default: 'social'
    category: conn.footer.bar
    enum:
      copyright: 'Copyright'
      social: 'Social links'
      navigation: 'Navigation (inline)'
      brand: 'Brand'
      brandTagline: 'Brand & tagline'
      tagline: 'Tagline'
      '': 'Empty'

  footer.bar.leftMobileAlign:
    label: 'Bottom bar – Left slot text alignment (mobile, <768px)'
    type: string
    default: ''
    category: conn.footer.bar
    enum:
      '': 'Left'
      'text-center': 'Center'
      'text-end': 'Right'

  footer.bar.centerMobileAlign:
    label: 'Bottom bar – Center slot text alignment (mobile, <768px)'
    type: string
    default: 'text-center'
    category: conn.footer.bar
    enum:
      '': 'Left'
      'text-center': 'Center'
      'text-end': 'Right'

  footer.bar.rightMobileAlign:
    label: 'Bottom bar – Right slot text alignment (mobile, <768px)'
    type: string
    default: ''
    category: conn.footer.bar
    enum:
      '': 'Left'
      'text-center': 'Center'
      'text-end': 'Right'

  # ─── Footer – Colors ──────────────────────────────────────────────────────
  # CSS var (ThemeVarsProcessor): --conn-footer-bg
  theme.light.footerBg:
    label: 'Footer background'
    description: 'Footer background color. Overridden by its dark-mode variant below when set.'
    type: string
    default: ''
    category: conn.footer.colors

  # CSS var (ThemeVarsProcessor): --conn-footer-bg
  theme.dark.footerBg:
    label: 'Footer background (dark)'
    description: 'Dark-mode variant. Falls back to the light footer background above when empty.'
    type: string
    default: ''
    category: conn.footer.colors

  # CSS var (ThemeVarsProcessor): --conn-footer-text
  theme.light.footerText:
    label: 'Footer text'
    description: 'Text color inside the footer. Falls back to the general text color when empty.'
    type: string
    default: ''
    category: conn.footer.colors

  # CSS var (ThemeVarsProcessor): --conn-footer-text
  theme.dark.footerText:
    label: 'Footer text (dark)'
    description: 'Dark-mode variant. Falls back to the light footer text above when empty.'
    type: string
    default: ''
    category: conn.footer.colors

  # CSS var (ThemeVarsProcessor): --conn-footer-link
  theme.light.footerLink:
    label: 'Footer link'
    description: 'Color of footer links (nav, phone, email) in their default state. Falls back to the general link color when empty — set this explicitly if the footer background does not contrast with the link color (e.g. a dark footer on a light site).'
    type: string
    default: ''
    category: conn.footer.colors

  # CSS var (ThemeVarsProcessor): --conn-footer-link
  theme.dark.footerLink:
    label: 'Footer link (dark)'
    description: 'Dark-mode variant. Falls back to the light footer link above when empty.'
    type: string
    default: ''
    category: conn.footer.colors

  # CSS var (ThemeVarsProcessor): --conn-footer-link-hover
  theme.light.footerLinkHover:
    label: 'Footer link hover'
    description: 'Hover color for footer links (nav, address, social). Falls back to the general accent color when empty — set this explicitly if the footer background does not contrast with the accent color (e.g. a dark footer on a light site).'
    type: string
    default: ''
    category: conn.footer.colors

  # CSS var (ThemeVarsProcessor): --conn-footer-link-hover
  theme.dark.footerLinkHover:
    label: 'Footer link hover (dark)'
    description: 'Dark-mode variant. Falls back to the light footer link hover above when empty.'
    type: string
    default: ''
    category: conn.footer.colors

  # CSS var (ThemeVarsProcessor): --conn-footer-link-hover-underline
  theme.light.footerLinkHoverUnderline:
    label: 'Footer link hover underline'
    description: 'Color of the sliding underline shown on footer link hover. Falls back to the footer link hover color when empty, then the general accent color.'
    type: string
    default: ''
    category: conn.footer.colors

  # CSS var (ThemeVarsProcessor): --conn-footer-link-hover-underline
