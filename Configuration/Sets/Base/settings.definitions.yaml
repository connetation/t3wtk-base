  # ─── Advanced – Fluid Styled Content: Templates ───────────────────────────
  # These settings are OWNED by typo3/fluid-styled-content; they are
  # re-declared here (definitions merge last-set-wins) only to add proper
  # labels and descriptions. type/default/enum MUST stay identical to the
  # originals in EXT:fluid_styled_content .../settings.definitions.yaml.
  styles.templates.templateRootPath:
    label: 'Additional template path'
    description: 'Extra Fluid template path for standard content elements, injected at layer 10. UNUSED in conn projects: layer 10 is taken by conn_t3kit_base — leave empty and place template overrides in the sitepackage instead.'
    type: string
    default: ''
    category: fsc.templates
    readonly: true

  styles.templates.partialRootPath:
    label: 'Additional partial path'
    description: 'Extra Fluid partial path for standard content elements, injected at layer 10. UNUSED in conn projects: layer 10 is taken by conn_t3kit_base — leave empty and place partial overrides in the sitepackage instead.'
    type: string
    default: ''
    category: fsc.templates
    readonly: true

  styles.templates.layoutRootPath:
    label: 'Additional layout path'
    description: 'Extra Fluid layout path for standard content elements, injected at layer 10. UNUSED in conn projects: layer 10 is taken by conn_t3kit_base — leave empty and place layout overrides in the sitepackage instead.'
    type: string
    default: ''
    category: fsc.templates
    readonly: true

  # ─── Advanced – Fluid Styled Content: Content Elements ────────────────────
  styles.content.defaultHeaderType:
    label: 'Default header type'
    description: 'Heading tag used when an editor leaves the header type on "Default": 1 = <h1> … 5 = <h5>. Keep 2 so <h1> stays reserved for the page title.'
    type: int
    default: 2
    category: fsc.content

  styles.content.shortcut.tables:
    label: 'Insert Records: allowed tables'
    description: 'Comma-separated database tables the "Insert Records" (shortcut) element is allowed to render. Normally only tt_content.'
    type: string
    default: tt_content
    category: fsc.content

  styles.content.image.lazyLoading:
    label: 'Image loading'
    description: 'loading attribute on content images. lazy = load only when scrolled into view (default, best performance) · eager = load immediately (for above-the-fold images) · auto = browser decides.'
    type: string
    enum:
      - lazy
      - eager
      - auto
    category: fsc.content
    default: lazy

  styles.content.image.imageDecoding:
    label: 'Image decoding'
    description: 'decoding attribute on content images. async = decode off the main thread (smoother scrolling) · sync = decode immediately · empty = omit the attribute (browser default).'
    type: string
    enum:
      - sync
      - async
      - auto
    category: fsc.content
    default: ''

  styles.content.textmedia.maxW:
    label: 'Text & Media: max media width'
    description: 'Maximum width in px of the media area in Text & Media elements when the media sits above/below the text. UNUSED in conn projects: conn_t3kit_base renders galleries as a fluid CSS grid (Media/Gallery partial override) that ignores this pixel budget — columns always share the available content width.'
    type: int
    default: 600
    category: fsc.content
    readonly: true

  styles.content.textmedia.maxWInText:
    label: 'Text & Media: max media width beside text'
    description: 'Maximum width in px of the media area when text wraps around it (media positioned left/right in text). UNUSED in conn projects: conn_t3kit_base renders galleries as a fluid CSS grid (Media/Gallery partial override) that ignores this pixel budget — columns always share the available content width. Beside text, the editor’s Columns select defines the media/text split instead (2 = 50/50, 3 = 1/3 vs 2/3, …).'
    type: int
    default: 300
    category: fsc.content
    readonly: true

  styles.content.textmedia.columnSpacing:
    label: 'Text & Media: column gap'
    description: 'Horizontal gap in px between media columns when a Text & Media element shows multiple images side by side.'
    type: int
    default: 10
    category: fsc.content

  styles.content.textmedia.rowSpacing:
    label: 'Text & Media: row gap'
    description: 'Vertical gap in px between media rows when a Text & Media element shows multiple images in several rows.'
    type: int
    default: 10
    category: fsc.content

  styles.content.textmedia.textMargin:
    label: 'Text & Media: text gap'
    description: 'Gap in px between the media area and the text that wraps around it.'
    type: int
    default: 10
    category: fsc.content

  styles.content.textmedia.borderColor:
    label: 'Image border color'
    description: 'Border color for images when an editor enables "Border" (Media tab → Image Adjustments palette) in a Text & Media, Text & Images or Images element.'
    type: color
    default: '#000000'
    category: fsc.content

  styles.content.textmedia.borderWidth:
    label: 'Image border width'
    description: 'Border width in px for images with the "Border" option (Media tab) enabled.'
    type: int
    default: 2
    category: fsc.content

  styles.content.textmedia.borderPadding:
    label: 'Image border padding'
    description: 'Inner spacing in px between the image and its border when the "Border" option (Media tab) is enabled.'
    type: int
    default: 0
    category: fsc.content

  styles.content.textmedia.linkWrap.width:
    label: 'Click-enlarge: image width'
    description: 'Size of the enlarged image when "Enlarge on Click" is enabled. An "m" suffix means proportional maximum, e.g. 800m = at most 800 px wide, aspect ratio kept. UNUSED in conn projects: conn_t3kit_base replaces the whole click-enlarge/popup mechanism with its built-in GLightbox integration (see conn_t3kit_base Lib.typoscript), which ignores this value.'
    type: string
    default: 800m
    category: fsc.content
    readonly: true

  styles.content.textmedia.linkWrap.height:
    label: 'Click-enlarge: image height'
    description: 'Maximum height of the enlarged image. "m" suffix = proportional maximum (see width). UNUSED in conn projects: conn_t3kit_base replaces the whole click-enlarge/popup mechanism with its built-in GLightbox integration (see conn_t3kit_base Lib.typoscript), which ignores this value.'
    type: string
    default: 600m
    category: fsc.content
    readonly: true

  styles.content.textmedia.linkWrap.newWindow:
    label: 'Click-enlarge: open in new window'
    description: 'Open the enlarged image in a new browser window instead of the current tab. UNUSED in conn projects: conn_t3kit_base replaces the whole click-enlarge/popup mechanism with its built-in GLightbox integration (see conn_t3kit_base Lib.typoscript), which ignores this value.'
    type: bool
    default: false
    category: fsc.content
    readonly: true

  styles.content.textmedia.linkWrap.lightboxEnabled:
    label: 'Click-enlarge: use lightbox'
    description: 'Render "Enlarge on Click" images as lightbox links instead of plain image links. UNUSED in conn projects: conn_t3kit_base replaces the whole click-enlarge/popup mechanism with its built-in GLightbox integration (see conn_t3kit_base Lib.typoscript), which ignores this value.'
    type: bool
    default: false
    category: fsc.content
    readonly: true

  styles.content.textmedia.linkWrap.lightboxCssClass:
    label: 'Lightbox: CSS class'
    description: 'CSS class added to lightbox links. UNUSED in conn projects: conn_t3kit_base replaces the whole click-enlarge/popup mechanism with its built-in GLightbox integration (see conn_t3kit_base Lib.typoscript), which ignores this value.'
    type: string
    default: lightbox
    category: fsc.content
    readonly: true

  styles.content.textmedia.linkWrap.lightboxRelAttribute:
    label: 'Lightbox: rel attribute'
    description: 'rel attribute added to lightbox links, used to group images of one element into a gallery. UNUSED in conn projects: conn_t3kit_base replaces the whole click-enlarge/popup mechanism with its built-in GLightbox integration (see conn_t3kit_base Lib.typoscript), which ignores this value.'
    type: string
    default: 'lightbox[{field:uid}]'
    category: fsc.content
    readonly: true

  # ══ HEADER AREA — navbar, theme toggle, branding/logo ═════════════════════

  # ─── Navbar – General ─────────────────────────────────────────────────────
  navbar.style:
    label: 'Navbar style'
    type: string
    default: 'NavTop'
    category: conn.navbar
    enum:
      NavTop: 'Navigation – Top (horizontal)'
      NavLeft: 'Navigation – Slide from left'
      NavRight: 'Navigation – Slide from right'

  navbar.position:
    label: 'Navbar position'
    type: string
    default: 'sticky-top'
    category: conn.navbar
    enum:
      sticky-top: 'Sticky top'
      fixed-top: 'Fixed top'
      fixed-bottom: 'Fixed bottom'
      '': 'Static'

  navbar.mobileBreakpoint:
    label: 'Panel breakpoint'
    description: 'For NavTop: screen width at which the nav switches from hamburger to inline. For NavLeft / NavRight: screen width at which the panel becomes a fixed-width sidebar instead of full-screen.'
    type: string
    default: 'lg'
    category: conn.navbar
    enum:
      sm: 'Small (≥ 576 px)'
      md: 'Medium (≥ 768 px)'
      lg: 'Large (≥ 992 px)'
      xl: 'Extra large (≥ 1200 px)'
      xxl: 'Extra extra large (≥ 1400 px)'

  navbar.navigationLevels:
    label: 'Navigation depth'
    description: 'Number of navigation levels rendered. 1 = top-level only (no dropdowns/sub-items), 2 = top + sub-items (default), 3+ = full depth rendered for all navigation types.'
    type: int
    default: 2
    category: conn.navbar

  navbar.logoPosition:
    label: 'Logo position'
    type: string
    default: 'left'
    category: conn.navbar
    enum:
      left: 'Left'
      center: 'Center'
      right: 'Right'

  # ─── Navbar – NavTop (desktop top bar) ────────────────────────────────────
  navbar.alignment:
    label: 'Navigation item alignment'
    description: 'How navigation items are aligned within the navbar. Applies to nav-top only.'
    type: string
    default: 'start'
    category: conn.navbar.top
    enum:
      start: 'Left'
      center: 'Center'
      end: 'Right'

  navbar.topDropdownStyle:
    label: 'Dropdown display style'
    description: 'How sub-menu items are displayed on desktop. Applies to nav-top only.'
    type: string
    default: 'list'
    category: conn.navbar.top
    enum:
      list: 'List (standard vertical dropdown)'
      grid: 'Grid (horizontal card grid)'

  navbar.gridDropdownAlign:
    label: 'Grid dropdown alignment'
    description: 'How the grid dropdown aligns to its trigger item. Auto detects position in viewport.'
    type: string
    default: 'auto'
    category: conn.navbar.top
    enum:
      auto: 'Auto (by item position)'
      left: 'Always left'
      center: 'Always center'
      right: 'Always right'

  navbar.offcanvasPosition:
    label: 'Mobile panel – slide from'
    description: 'Slide direction of the mobile panel on NavTop. Has no effect on NavLeft (always left) or NavRight (always right).'
    type: string
    default: 'offcanvas-end'
    category: conn.navbar.top
    enum:
      offcanvas-end: 'Right'
      offcanvas-start: 'Left'
      offcanvas-top: 'Top'
      offcanvas-bottom: 'Bottom'

  # ─── Navbar – Panel (NavLeft / NavRight / mobile) ─────────────────────────
  navbar.mobilePanelAlign:
    label: 'Panel – alignment (mobile)'
    description: 'Content alignment inside the panel at mobile / full-screen size.'
    type: string
    default: 'start'
    category: conn.navbar.panel
    enum:
      start: 'Left'
      center: 'Center'
      end: 'Right'

  navbar.desktopPanelAlign:
    label: 'Panel – alignment (desktop)'
    description: 'Content alignment inside the panel once it becomes a sidebar at the panel breakpoint. Leave empty to use the same alignment as mobile.'
    type: string
    default: ''
    category: conn.navbar.panel
    enum:
      '': 'Same as mobile'
      start: 'Left'
      center: 'Center'
      end: 'Right'

  navbar.panelTopContent:
    label: 'Panel – top content'
    description: 'Content shown above the navigation list in the panel.'
    type: string
    default: ''
    category: conn.navbar.panel
    enum:
      '': 'None'
      social: 'Social media links'
      contact: 'Contact (email & phone)'
      address: 'Full address'

  navbar.panelBottomContent:
    label: 'Panel – bottom content'
    description: 'Content shown below the navigation list in the panel.'
    type: string
    default: 'social'
    category: conn.navbar.panel
    enum:
      '': 'None'
      social: 'Social media links'
      contact: 'Contact (email & phone)'
      address: 'Full address'

  navbar.offcanvasScroll:
    label: 'Allow body scrolling'
    description: 'Allow the page to scroll while the panel is open.'
    type: bool
    default: false
    category: conn.navbar.panel

  navbar.offcanvasBackdrop:
    label: 'Backdrop'
    type: string
    default: 'true'
    category: conn.navbar.panel
    enum:
      'true': 'Show backdrop'
      'false': 'No backdrop'
      static: 'Static (click outside does not close)'

  # ─── Navbar – Colors ──────────────────────────────────────────────────────
  # CSS var (ThemeVarsProcessor): --conn-nav-bg
  theme.light.navBg:
    label: 'Navbar background'
    description: 'Navbar and offcanvas panel background color. Overridden by its dark-mode variant below when set.'
    type: string
    default: ''
    category: conn.navbar.colors

  # CSS var (ThemeVarsProcessor): --conn-nav-bg
  theme.dark.navBg:
    label: 'Navbar background (dark)'
    description: 'Dark-mode variant. Falls back to the light navbar background above when empty.'
    type: string
    default: ''
    category: conn.navbar.colors

  # CSS var (ThemeVarsProcessor): --conn-nav-text
  theme.light.navText:
    label: 'Navbar text'
    description: 'Text color inside the navbar and offcanvas panel. Falls back to the general text color when empty.'
    type: string
    default: ''
    category: conn.navbar.colors

  # CSS var (ThemeVarsProcessor): --conn-nav-text
  theme.dark.navText:
    label: 'Navbar text (dark)'
    description: 'Dark-mode variant. Falls back to the light navbar text above when empty.'
    type: string
    default: ''
    category: conn.navbar.colors

  # ─── Theme toggle ─────────────────────────────────────────────────────────
  themeToggle.enabled:
    label: 'Theme toggle – show button'
    description: 'Show the light/dark theme toggle button. Disable to remove it from the navbar and footer.'
    type: bool
    default: false
    category: conn.themetoggle

  themeToggle.position:
    label: 'Theme toggle – fixed position'
    description: 'Show a floating theme toggle button at a fixed screen position. "None" keeps only the inline button in the navbar.'
    type: string
    default: ''
    category: conn.themetoggle
    enum:
      '': 'None (inline in navbar only)'
      bottom-right: 'Bottom right'
      bottom-left: 'Bottom left'
      top-right: 'Top right'
      top-left: 'Top left'

  themeToggle.offsetX:
    label: 'Theme toggle – horizontal offset (px)'
    description: 'Distance in pixels from the left or right screen edge.'
    type: int
    default: 24
    category: conn.themetoggle

  themeToggle.offsetY:
    label: 'Theme toggle – vertical offset (px)'
    description: 'Distance in pixels from the top or bottom screen edge.'
    type: int
    default: 24
    category: conn.themetoggle

  # ─── Branding ─────────────────────────────────────────────────────────────
  branding.logo:
    label: 'Logo – light mode'
    description: 'EXT: path (e.g. EXT:conn_t3kit_base/Resources/Public/Icons/logo.svg) or full URL (https://…). Leave empty to show the site title as text.'
    type: string
    default: ''
    category: conn.branding

  branding.logoDark:
    label: 'Logo – dark mode'
    description: 'Alternate logo for dark mode. Same format as the light logo. Falls back to the light logo when empty.'
    type: string
    default: ''
    category: conn.branding

  branding.logoAlt:
    label: 'Logo alt text'
    description: 'Alt text for the logo image. Defaults to the site title when empty.'
    type: string
    default: ''
    category: conn.branding

  branding.logoWidth:
    label: 'Logo width (px)'
    description: 'Optional. Leave empty to scale automatically from the height (or from the image itself if both are empty).'
    type: int
    default: 0
    category: conn.branding

  branding.logoHeight:
    label: 'Logo height (px)'
    description: 'Optional. Leave empty to scale automatically from the width (or from the image itself if both are empty).'
    type: int
    default: 0
    category: conn.branding

  # Favicon set — all paths: EXT: path, fileadmin path or full URL. Each one is optional;
  # set all of them for full coverage. Rendered by BrandingIconsProcessor, root URLs
  # (/favicon.ico, /apple-touch-icon.png, /site.webmanifest) served by BrandingIconsMiddleware.
  branding.favicon:
    label: 'Favicon (SVG)'
    description: 'Main browser tab icon for modern browsers. SVG recommended — for dark mode, put a @media (prefers-color-scheme: dark) rule inside the SVG. A PNG also works.'
    type: string
    default: ''
    category: conn.branding

  branding.faviconIco:
    label: 'Favicon fallback (ICO)'
    description: '32×32 favicon.ico for older browsers, RSS readers and crawlers. Also served at /favicon.ico. If empty, /favicon.ico serves the Favicon setting when it is not an SVG.'
    type: string
    default: ''
    category: conn.branding

  branding.appleTouchIcon:
    label: 'Apple touch icon'
    description: 'Home-screen icon for iOS/iPadOS. 180×180 px PNG, no transparency. Also served at /apple-touch-icon.png.'
    type: string
    default: ''
    category: conn.branding

  branding.manifestIcon192:
    label: 'App icon 192×192 (Android)'
    description: '192×192 px PNG for the Android home screen. Setting this or the 512 icon enables /site.webmanifest.'
    type: string
    default: ''
    category: conn.branding

  branding.manifestIcon512:
    label: 'App icon 512×512 (Android)'
    description: '512×512 px PNG for the Android home screen and splash screen.'
    type: string
    default: ''
    category: conn.branding

  # ══ FOOTER AREA ═══════════════════════════════════════════════════════════

  # ─── Footer – General ─────────────────────────────────────────────────────
  footer.beforeSpacing:
    label: 'Space before footer'
    description: 'Gap above the footer. Same scale (and same "Default" value, --conn-space-lg) as a content element''s Appearance → Space Before/After.'
    type: string
    default: ''
    category: conn.footer
    enum:
      '': 'Default'
      none: 'None'
      extra-extra-small: 'Extra Extra Small'
      extra-small: 'Extra Small'
      small: 'Small'
      medium: 'Medium'
      large: 'Large'
      extra-large: 'Extra Large'
      extra-extra-large: 'Extra Extra Large'

  footer.layout:
    label: 'Footer layout'
    type: string
    default: 'Standard'
    category: conn.footer
    enum:
      Standard: 'Standard (brand + columns)'
      Centered: 'Centered'
      Minimal: 'Minimal (bar only)'

  footer.tagline:
    label: 'Footer tagline'
    description: 'Short text below the brand name in the footer. Ignored when a tagline icon is set.'
    type: string
    default: ''
    category: conn.footer

  footer.taglineIcon:
    label: 'Footer tagline icon'
    description: 'EXT: path, absolute path (/fileadmin/…), or full URL. When set, renders instead of the tagline text.'
    type: string
    default: ''
    category: conn.footer

  footer.taglineIconWidth:
    label: 'Footer tagline icon width (px)'
    description: 'Optional. Leave empty to scale automatically from the height (or from the image itself if both are empty).'
    type: int
    default: 0
    category: conn.footer

  footer.taglineIconHeight:
    label: 'Footer tagline icon height (px)'
    description: 'Optional. Leave empty to scale automatically from the width (or from the image itself if both are empty).'
    type: int
    default: 0
    category: conn.footer

  footer.copyrightName:
    label: 'Copyright name'
    description: 'Name used in the © copyright line. Defaults to the site title when empty.'
    type: string
    default: ''
    category: conn.footer

  footer.logo:
    label: 'Footer logo – light mode'
    description: 'Separate logo for the footer. Accepts EXT: paths or full URLs. Falls back to the navbar logo when empty.'
    type: string
    default: ''
    category: conn.footer

  footer.logoDark:
    label: 'Footer logo – dark mode'
    description: 'Dark-mode variant of the footer logo. Accepts EXT: paths or full URLs. Falls back to the light footer logo when empty.'
    type: string
    default: ''
    category: conn.footer

  footer.logoWidth:
    label: 'Footer logo width (px)'
    description: 'Optional. Leave both this and footer logo height empty to use the branding logo size. Set either one to size the footer logo independently of the header (the other dimension then scales automatically).'
    type: int
    default: 0
    category: conn.footer

  footer.logoHeight:
    label: 'Footer logo height (px)'
    description: 'Optional. Leave both this and footer logo width empty to use the branding logo size. Set either one to size the footer logo independently of the header (the other dimension then scales automatically).'
    type: int
    default: 0
    category: conn.footer

  footer.showSocial:
    label: 'Show social media links'
    type: bool
    default: false
    category: conn.footer

  # ─── Footer – Bottom bar ──────────────────────────────────────────────────
  footer.bar.show:
    label: 'Show bottom bar'
    type: bool
    default: true
    category: conn.footer.bar

  footer.bar.left:
