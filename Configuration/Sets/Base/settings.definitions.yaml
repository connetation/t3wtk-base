  # ─── Meta & Analytics ─────────────────────────────────────────────────────
  meta.gtmId:
    label: 'Google Tag Manager ID'
    description: 'GTM container ID (e.g. GTM-XXXXXXX). Leave empty to disable GTM.'
    type: string
    default: ''
    category: conn.meta

  meta.googleVerification:
    label: 'Google site verification'
    description: 'Content value for the google-site-verification meta tag.'
    type: string
    default: ''
    category: conn.meta

  # ─── Fluid Styled Content – re-definitions ────────────────────────────────
  # These settings are OWNED by typo3/fluid-styled-content; they are
  # re-declared here (definitions merge last-set-wins) only to add proper
  # labels and descriptions. type/default/enum MUST stay identical to the
  # originals in EXT:fluid_styled_content .../settings.definitions.yaml.
  styles.templates.templateRootPath:
    label: 'Additional template path'
    description: 'Extra Fluid template path for standard content elements, injected at layer 10. UNUSED in conn projects: layer 10 is taken by conn_base — leave empty and place template overrides in the sitepackage instead.'
    type: string
    default: ''
    category: fsc.templates
    readonly: true

  styles.templates.partialRootPath:
    label: 'Additional partial path'
    description: 'Extra Fluid partial path for standard content elements, injected at layer 10. UNUSED in conn projects: layer 10 is taken by conn_base — leave empty and place partial overrides in the sitepackage instead.'
    type: string
    default: ''
    category: fsc.templates
    readonly: true

  styles.templates.layoutRootPath:
    label: 'Additional layout path'
    description: 'Extra Fluid layout path for standard content elements, injected at layer 10. UNUSED in conn projects: layer 10 is taken by conn_base — leave empty and place layout overrides in the sitepackage instead.'
    type: string
    default: ''
    category: fsc.templates
    readonly: true

  styles.content.defaultHeaderType:
    label: 'Default header type'
    description: 'Heading tag used when an editor leaves the header type on "Default": 1 = <h1> … 5 = <h5>. Keep 2 so <h1> stays reserved for the page title.'
    type: int
    default: 2
    category: fsc.content

  styles.content.shortcut.tables:
    label: 'Insert Records: allowed tables'
    description: 'Comma-separated database tables the "Insert Records" (shortcut) element is allowed to render. Normally only tt_content.'
    type: string
    default: tt_content
    category: fsc.content

  styles.content.image.lazyLoading:
    label: 'Image loading'
    description: 'loading attribute on content images. lazy = load only when scrolled into view (default, best performance) · eager = load immediately (for above-the-fold images) · auto = browser decides.'
    type: string
    enum:
      - lazy
      - eager
      - auto
    category: fsc.content
    default: lazy

  styles.content.image.imageDecoding:
    label: 'Image decoding'
    description: 'decoding attribute on content images. async = decode off the main thread (smoother scrolling) · sync = decode immediately · empty = omit the attribute (browser default).'
    type: string
    enum:
      - sync
      - async
      - auto
    category: fsc.content
    default: ''

  styles.content.textmedia.maxW:
    label: 'Text & Media: max media width'
    description: 'Maximum width in px of the media area in Text & Media elements when the media sits above/below the text. UNUSED in conn projects: conn_base renders galleries as a fluid CSS grid (Media/Gallery partial override) that ignores this pixel budget — columns always share the available content width.'
    type: int
    default: 600
    category: fsc.content
    readonly: true

  styles.content.textmedia.maxWInText:
    label: 'Text & Media: max media width beside text'
    description: 'Maximum width in px of the media area when text wraps around it (media positioned left/right in text). UNUSED in conn projects: conn_base renders galleries as a fluid CSS grid (Media/Gallery partial override) that ignores this pixel budget — columns always share the available content width. Beside text, the editor’s Columns select defines the media/text split instead (2 = 50/50, 3 = 1/3 vs 2/3, …).'
    type: int
    default: 300
    category: fsc.content
    readonly: true

  styles.content.textmedia.columnSpacing:
    label: 'Text & Media: column gap'
    description: 'Horizontal gap in px between media columns when a Text & Media element shows multiple images side by side.'
    type: int
    default: 10
    category: fsc.content

  styles.content.textmedia.rowSpacing:
    label: 'Text & Media: row gap'
    description: 'Vertical gap in px between media rows when a Text & Media element shows multiple images in several rows.'
    type: int
    default: 10
    category: fsc.content

  styles.content.textmedia.textMargin:
    label: 'Text & Media: text gap'
    description: 'Gap in px between the media area and the text that wraps around it.'
    type: int
    default: 10
    category: fsc.content

  styles.content.textmedia.borderColor:
    label: 'Image border color'
    description: 'Border color for images when an editor enables "Border" (Media tab → Image Adjustments palette) in a Text & Media, Text & Images or Images element.'
    type: color
    default: '#000000'
    category: fsc.content

  styles.content.textmedia.borderWidth:
    label: 'Image border width'
    description: 'Border width in px for images with the "Border" option (Media tab) enabled.'
    type: int
    default: 2
    category: fsc.content

  styles.content.textmedia.borderPadding:
    label: 'Image border padding'
    description: 'Inner spacing in px between the image and its border when the "Border" option (Media tab) is enabled.'
    type: int
    default: 0
    category: fsc.content

  styles.content.textmedia.linkWrap.width:
    label: 'Click-enlarge: image width'
    description: 'Size of the enlarged image when "Enlarge on Click" is enabled. An "m" suffix means proportional maximum, e.g. 800m = at most 800 px wide, aspect ratio kept. UNUSED in conn projects: conn_base replaces the whole click-enlarge/popup mechanism with its built-in GLightbox integration (see conn_base Lib.typoscript), which ignores this value.'
    type: string
    default: 800m
    category: fsc.content
    readonly: true

  styles.content.textmedia.linkWrap.height:
    label: 'Click-enlarge: image height'
    description: 'Maximum height of the enlarged image. "m" suffix = proportional maximum (see width). UNUSED in conn projects: conn_base replaces the whole click-enlarge/popup mechanism with its built-in GLightbox integration (see conn_base Lib.typoscript), which ignores this value.'
    type: string
    default: 600m
    category: fsc.content
    readonly: true

  styles.content.textmedia.linkWrap.newWindow:
    label: 'Click-enlarge: open in new window'
    description: 'Open the enlarged image in a new browser window instead of the current tab. UNUSED in conn projects: conn_base replaces the whole click-enlarge/popup mechanism with its built-in GLightbox integration (see conn_base Lib.typoscript), which ignores this value.'
    type: bool
    default: false
    category: fsc.content
    readonly: true

  styles.content.textmedia.linkWrap.lightboxEnabled:
    label: 'Click-enlarge: use lightbox'
    description: 'Render "Enlarge on Click" images as lightbox links instead of plain image links. UNUSED in conn projects: conn_base replaces the whole click-enlarge/popup mechanism with its built-in GLightbox integration (see conn_base Lib.typoscript), which ignores this value.'
    type: bool
    default: false
    category: fsc.content
    readonly: true

  styles.content.textmedia.linkWrap.lightboxCssClass:
    label: 'Lightbox: CSS class'
    description: 'CSS class added to lightbox links. UNUSED in conn projects: conn_base replaces the whole click-enlarge/popup mechanism with its built-in GLightbox integration (see conn_base Lib.typoscript), which ignores this value.'
    type: string
    default: lightbox
    category: fsc.content
    readonly: true

  styles.content.textmedia.linkWrap.lightboxRelAttribute:
    label: 'Lightbox: rel attribute'
    description: 'rel attribute added to lightbox links, used to group images of one element into a gallery. UNUSED in conn projects: conn_base replaces the whole click-enlarge/popup mechanism with its built-in GLightbox integration (see conn_base Lib.typoscript), which ignores this value.'
    type: string
    default: 'lightbox[{field:uid}]'
    category: fsc.content
    readonly: true
