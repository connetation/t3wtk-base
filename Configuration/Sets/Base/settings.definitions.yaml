categories:
  conn.theme:
    label: 'Theme & Colors'
  conn.theme.color:
    label: 'Color'
    description: 'The base color scheme — used as-is (this is also what light mode renders, since light is the default theme). Override any of these for dark mode only under "Dark-theme coloring".'
    parent: conn.theme
  conn.theme.dark:
    label: 'Dark-theme coloring'
    description: 'Per-setting overrides applied only when dark mode is active. Leave a setting empty here to keep using its Color value in dark mode too.'
    parent: conn.theme
  conn.navbar:
    label: 'Navbar'
  conn.navbar.top:
    label: 'NavTop'
    parent: conn.navbar
  conn.navbar.panel:
    label: 'Panel (NavLeft / NavRight / mobile)'
    parent: conn.navbar
  conn.navbar.colors:
    label: 'Navbar – Colors'
    parent: conn.navbar
  conn.themetoggle:
    label: 'Theme toggle'
  conn.branding:
    label: 'Branding'
  conn.contact:
    label: 'Contact Information'
  conn.footer:
    label: 'Footer'
  conn.footer.colors:
    label: 'Footer – Colors'
    parent: conn.footer
  conn.footer.grid:
    label: 'Footer – Grid'
    parent: conn.footer
  conn.footer.bar:
    label: 'Footer – Bottom bar'
    parent: conn.footer
  conn.footer.navigation:
    label: 'Footer – Navigation'
    parent: conn.footer
  conn.footer.barNavigation:
    label: 'Footer – Bottom bar navigation'
    parent: conn.footer
  conn.social:
    label: 'Social Media'
  conn.meta:
    label: 'Meta & Analytics'
  conn.advanced:
    label: 'Advanced'
  fsc:
    label: 'Fluid Styled Content'
    parent: conn.advanced
  fsc.templates:
    label: 'Templates'
    description: 'Global Fluid override paths shipped by fluid_styled_content. In conn projects these are superseded by the package layering (conn_base → conn_elements → sitepackage) — leave all three empty and override templates in the sitepackage instead.'
    parent: fsc
  fsc.content:
    label: 'Content Elements'
    description: 'Rendering options for the standard content elements (Text, Text & Media, Images, Insert Records, …).'
    parent: fsc

settings:
  # ─── Color (base/default — used directly, dark mode below overrides it) ──
  theme.accentSecondary:
    label: 'Accent secondary'
    description: 'Secondary accent color used in card hover gradients and highlights (e.g. #06b6d4). Leave empty to keep the built-in default.'
    type: string
    default: ''
    category: conn.theme.color

  theme.linkHoverEffect:
    label: 'Animated underline on link hover'
    description: 'Grows an underline in from the left under links on hover, using the link/link-hover colors.'
    type: bool
    default: false
    category: conn.theme.color

  theme.shadowHover.color:
    label: 'Card hover shadow – color'
    description: 'Shadow color including opacity. Any CSS color with alpha, e.g. rgb(99 102 241 / 22%) or rgba(99,102,241,0.22). Leave empty to keep the built-in default.'
    type: string
    default: ''
    category: conn.theme.color

  theme.shadowHover.blur:
    label: 'Card hover shadow – blur radius'
    description: 'Blur radius of the hover shadow, e.g. 32px. Leave empty to keep the built-in default (32px).'
    type: string
    default: ''
    category: conn.theme.color

  theme.shadowHover.offsetY:
    label: 'Card hover shadow – vertical offset'
    description: 'Vertical offset of the hover shadow, e.g. 8px. Leave empty to keep the built-in default (8px).'
    type: string
    default: ''
    category: conn.theme.color

  theme.shadowHover.offsetX:
    label: 'Card hover shadow – horizontal offset'
    description: 'Horizontal offset of the hover shadow, e.g. 0. Leave empty to keep the built-in default (0).'
    type: string
    default: ''
    category: conn.theme.color

  theme.shadowHover.spread:
    label: 'Card hover shadow – spread radius'
    description: 'Spread radius of the hover shadow, e.g. 4px. Leave empty to keep the built-in default (0).'
    type: string
    default: ''
    category: conn.theme.color

  theme.light.accent:
    label: 'Accent color'
    description: 'Primary brand/accent color. Any CSS color value (e.g. #6366f1, rgb(99,102,241)). Leave empty to keep the built-in default. Overridden per-setting by "Dark-theme coloring" below when set.'
    type: string
    default: ''
    category: conn.theme.color

  theme.light.accentHover:
    label: 'Accent – hover'
    description: 'Accent color on hover/focus. Leave empty to keep the built-in default.'
    type: string
    default: ''
    category: conn.theme.color

  theme.light.bg:
    label: 'Page background'
    description: 'Page background color for light mode.'
    type: string
    default: ''
    category: conn.theme.color

  theme.light.surface:
    label: 'Surface color'
    description: 'Card / panel surface color for light mode.'
    type: string
    default: ''
    category: conn.theme.color

  theme.light.navBg:
    label: 'Navbar background'
    description: 'Navbar and offcanvas panel background color. Overridden by "Dark-theme coloring" below when set.'
    type: string
    default: ''
    category: conn.navbar.colors

  theme.light.navText:
    label: 'Navbar text'
    description: 'Text color inside the navbar and offcanvas panel. Falls back to the general text color when empty.'
    type: string
    default: ''
    category: conn.navbar.colors

  theme.light.footerBg:
    label: 'Footer background'
    description: 'Footer background color. Overridden by "Dark-theme coloring" below when set.'
    type: string
    default: ''
    category: conn.footer.colors

  theme.light.footerText:
    label: 'Footer text'
    description: 'Text color inside the footer. Falls back to the general text color when empty.'
    type: string
    default: ''
    category: conn.footer.colors

  theme.light.footerHeaderText:
    label: 'Footer header text'
    description: 'Text color for footer section headers ("Navigation", "Contact", …). Falls back to the footer text color when empty.'
    type: string
    default: ''
    category: conn.footer.colors

  theme.light.footerLinkHover:
    label: 'Footer link hover'
    description: 'Hover color for footer links (nav, address, social). Falls back to the general accent color when empty — set this explicitly if the footer background does not contrast with the accent color (e.g. a dark footer on a light site).'
    type: string
    default: ''
    category: conn.footer.colors

  theme.light.footerLinkHoverUnderline:
    label: 'Footer link hover underline'
    description: 'Color of the sliding underline shown on footer link hover. Falls back to the footer link hover color when empty, then the general accent color.'
    type: string
    default: ''
    category: conn.footer.colors

  theme.light.text:
    label: 'Text color'
    description: 'Main body text color for light mode.'
    type: string
    default: ''
    category: conn.theme.color

  theme.light.heading:
    label: 'Headers color'
    description: 'Heading (h1–h6) color for light mode.'
    type: string
    default: ''
    category: conn.theme.color

  theme.light.emphasis:
    label: 'Emphasis color'
    description: 'Strong/bold text and emphasis color for light mode.'
    type: string
    default: ''
    category: conn.theme.color

  theme.light.link:
    label: 'Link color'
    description: 'Hyperlink color for light mode.'
    type: string
    default: ''
    category: conn.theme.color

  theme.light.linkHover.text:
    label: 'Link – hover color'
    description: 'Hyperlink text color on hover/focus for light mode.'
    type: string
    default: ''
    category: conn.theme.color

  theme.light.linkHover.underline:
    label: 'Link – hover underline color'
    description: 'Color of the animated underline effect (see "Animated underline on link hover") for light mode. Falls back to the link hover color when empty.'
    type: string
    default: ''
    category: conn.theme.color

  theme.light.textMuted:
    label: 'Muted text color'
    description: 'Secondary / muted text color for light mode.'
    type: string
    default: ''
    category: conn.theme.color

  theme.light.border:
    label: 'Border color'
    description: 'Default border color for light mode.'
    type: string
    default: ''
    category: conn.theme.color

  theme.light.borderStrong:
    label: 'Border color – strong'
    description: 'Stronger border color used for hover states, active dropdowns, and focus rings (e.g. rgba(99, 102, 241, 0.28)). Leave empty to keep the built-in default.'
    type: string
    default: ''
    category: conn.theme.color

  theme.light.accentSoft:
    label: 'Accent soft background'
    description: 'Low-opacity accent fill used for active stat cards, tag badges, and hover backgrounds (e.g. rgba(99, 102, 241, 0.1)). Leave empty to keep the built-in default.'
    type: string
    default: ''
    category: conn.theme.color

  theme.light.accentGlow:
    label: 'Accent glow'
    description: 'Medium-opacity accent used for glows and subtle highlights (e.g. rgba(99, 102, 241, 0.2)). Leave empty to keep the built-in default.'
    type: string
    default: ''
    category: conn.theme.color

  theme.light.btnBg:
    label: 'Button background'
    description: 'Primary button background color for light mode (e.g. #6366f1). Leave empty to use the accent color.'
    type: string
    default: ''
    category: conn.theme.color

  theme.light.btnBgHover:
    label: 'Button background – hover'
    description: 'Primary button background color on hover/active for light mode. Leave empty to use the accent hover color.'
    type: string
    default: ''
    category: conn.theme.color

  theme.light.btnColor:
    label: 'Button text color'
    description: 'Text (label) color on primary buttons for light mode (e.g. #ffffff). Leave empty to keep white.'
    type: string
    default: ''
    category: conn.theme.color

  # ─── Dark-theme coloring (overrides the Color settings above, dark mode only) ──
  theme.dark.accent:
    label: 'Accent color'
    description: 'Accent color for dark mode. Overrides the Color setting above. Leave empty to use that value.'
    type: string
    default: ''
    category: conn.theme.dark

  theme.dark.accentHover:
    label: 'Accent – hover'
    description: 'Accent hover color for dark mode. Leave empty to use the global value.'
    type: string
    default: ''
    category: conn.theme.dark

  theme.dark.bg:
    label: 'Page background'
    description: 'Page background color for dark mode.'
    type: string
    default: ''
    category: conn.theme.dark

  theme.dark.surface:
    label: 'Surface color'
    description: 'Card / panel surface color for dark mode.'
    type: string
    default: ''
    category: conn.theme.dark

  theme.dark.navBg:
    label: 'Navbar background'
    description: 'Navbar and offcanvas panel background for dark mode.'
    type: string
    default: ''
    category: conn.theme.dark

  theme.dark.navText:
    label: 'Navbar text'
    description: 'Text color inside the navbar and offcanvas panel for dark mode. Falls back to the general text color when empty.'
    type: string
    default: ''
    category: conn.theme.dark

  theme.dark.footerBg:
    label: 'Footer background'
    description: 'Footer background color for dark mode.'
    type: string
    default: ''
    category: conn.theme.dark

  theme.dark.footerText:
    label: 'Footer text'
    description: 'Text color inside the footer for dark mode. Falls back to the general text color when empty.'
    type: string
    default: ''
    category: conn.theme.dark

  theme.dark.footerHeaderText:
    label: 'Footer header text'
    description: 'Text color for footer section headers ("Navigation", "Contact", …) for dark mode. Falls back to the footer text color when empty.'
    type: string
    default: ''
    category: conn.theme.dark

  theme.dark.footerLinkHover:
    label: 'Footer link hover'
    description: 'Hover color for footer links (nav, address, social) for dark mode. Falls back to the general accent color when empty — set this explicitly if the footer background does not contrast with the accent color (e.g. a dark footer on a light site).'
    type: string
    default: ''
    category: conn.theme.dark

  theme.dark.footerLinkHoverUnderline:
    label: 'Footer link hover underline'
    description: 'Color of the sliding underline shown on footer link hover for dark mode. Falls back to the footer link hover color when empty, then the general accent color.'
    type: string
    default: ''
    category: conn.theme.dark

  theme.dark.text:
    label: 'Text color'
    description: 'Main body text color for dark mode.'
    type: string
    default: ''
    category: conn.theme.dark

  theme.dark.heading:
    label: 'Headers color'
    description: 'Heading (h1–h6) color for dark mode.'
    type: string
    default: ''
    category: conn.theme.dark

  theme.dark.emphasis:
    label: 'Emphasis color'
    description: 'Strong/bold text and emphasis color for dark mode.'
    type: string
    default: ''
    category: conn.theme.dark

  theme.dark.link:
    label: 'Link color'
    description: 'Hyperlink color for dark mode.'
    type: string
    default: ''
    category: conn.theme.dark

  theme.dark.linkHover.text:
    label: 'Link – hover color'
    description: 'Hyperlink text color on hover/focus for dark mode.'
    type: string
    default: ''
    category: conn.theme.dark

  theme.dark.linkHover.underline:
    label: 'Link – hover underline color'
    description: 'Color of the animated underline effect (see "Animated underline on link hover") for dark mode. Falls back to the link hover color when empty.'
    type: string
    default: ''
    category: conn.theme.dark

  theme.dark.textMuted:
    label: 'Muted text color'
    description: 'Secondary / muted text color for dark mode.'
    type: string
    default: ''
    category: conn.theme.dark

  theme.dark.border:
    label: 'Border color'
    description: 'Default border color for dark mode.'
    type: string
    default: ''
    category: conn.theme.dark

  theme.dark.borderStrong:
    label: 'Border color – strong'
    description: 'Stronger border color for hover states and focus rings in dark mode (e.g. rgba(255, 255, 255, 0.15)). Leave empty to keep the built-in default.'
    type: string
    default: ''
    category: conn.theme.dark

  theme.dark.accentSoft:
    label: 'Accent soft background'
    description: 'Low-opacity accent fill for dark mode (e.g. rgba(99, 102, 241, 0.15)). Leave empty to keep the built-in default.'
    type: string
    default: ''
    category: conn.theme.dark

  theme.dark.accentGlow:
    label: 'Accent glow'
    description: 'Medium-opacity accent glow for dark mode (e.g. rgba(99, 102, 241, 0.3)). Leave empty to keep the built-in default.'
    type: string
    default: ''
    category: conn.theme.dark

  theme.dark.btnBg:
    label: 'Button background'
    description: 'Primary button background color for dark mode. Leave empty to use the accent color.'
    type: string
    default: ''
    category: conn.theme.dark

  theme.dark.btnBgHover:
    label: 'Button background – hover'
    description: 'Primary button background color on hover/active for dark mode. Leave empty to use the accent hover color.'
    type: string
    default: ''
    category: conn.theme.dark

  theme.dark.btnColor:
    label: 'Button text color'
    description: 'Text (label) color on primary buttons for dark mode. Leave empty to keep white.'
    type: string
    default: ''
    category: conn.theme.dark

  # ─── Theme – Navigation typography ────────────────────────────────────────
  theme.nav.panelLinkSize:
    label: 'Panel nav – L1 font size'
    description: 'Font size for top-level links in the navigation panel (e.g. 1.125rem). Leave empty to keep the built-in default.'
    type: string
    default: ''
    category: conn.navbar.panel

  theme.nav.panelSubLinkSize:
    label: 'Panel nav – L2 font size'
    description: 'Font size for second-level links in the navigation panel.'
    type: string
    default: ''
    category: conn.navbar.panel

  theme.nav.panelSubLinkSizeL3:
    label: 'Panel nav – L3 font size'
    description: 'Font size for third-level links in the navigation panel.'
    type: string
    default: ''
    category: conn.navbar.panel

  # ─── Navbar – General ─────────────────────────────────────────────────────
  navbar.style:
    label: 'Navbar style'
    type: string
    default: 'NavTop'
    category: conn.navbar
    enum:
      NavTop: 'Navigation – Top (horizontal)'
      NavLeft: 'Navigation – Slide from left'
      NavRight: 'Navigation – Slide from right'

  navbar.position:
    label: 'Navbar position'
    type: string
    default: 'sticky-top'
    category: conn.navbar
    enum:
      sticky-top: 'Sticky top'
      fixed-top: 'Fixed top'
      fixed-bottom: 'Fixed bottom'
      '': 'Static'

  navbar.mobileBreakpoint:
    label: 'Panel breakpoint'
    description: 'For NavTop: screen width at which the nav switches from hamburger to inline. For NavLeft / NavRight: screen width at which the panel becomes a fixed-width sidebar instead of full-screen.'
    type: string
    default: 'lg'
    category: conn.navbar
    enum:
      sm: 'Small (≥ 576 px)'
      md: 'Medium (≥ 768 px)'
      lg: 'Large (≥ 992 px)'
      xl: 'Extra large (≥ 1200 px)'
      xxl: 'Extra extra large (≥ 1400 px)'

  navbar.navigationLevels:
    label: 'Navigation depth'
    description: 'Number of navigation levels rendered. 1 = top-level only (no dropdowns/sub-items), 2 = top + sub-items (default), 3+ = full depth rendered for all navigation types.'
    type: int
    default: 2
    category: conn.navbar

  # ─── Navbar – Desktop navigation ──────────────────────────────────────────
  navbar.logoPosition:
    label: 'Logo position'
    type: string
    default: 'left'
    category: conn.navbar
    enum:
      left: 'Left'
      center: 'Center'
      right: 'Right'

  navbar.alignment:
    label: 'Navigation item alignment'
    description: 'How navigation items are aligned within the navbar. Applies to nav-top only.'
    type: string
    default: 'start'
    category: conn.navbar.top
    enum:
      start: 'Left'
      center: 'Center'
      end: 'Right'

  navbar.topDropdownStyle:
    label: 'Dropdown display style'
    description: 'How sub-menu items are displayed on desktop. Applies to nav-top only.'
    type: string
    default: 'list'
    category: conn.navbar.top
    enum:
      list: 'List (standard vertical dropdown)'
      grid: 'Grid (horizontal card grid)'

  navbar.gridDropdownAlign:
    label: 'Grid dropdown alignment'
    description: 'How the grid dropdown aligns to its trigger item. Auto detects position in viewport.'
    type: string
    default: 'auto'
    category: conn.navbar.top
    enum:
      auto: 'Auto (by item position)'
      left: 'Always left'
      center: 'Always center'
      right: 'Always right'

  # ─── Navbar – Mobile panel ─────────────────────────────────────────────────
  navbar.offcanvasPosition:
    label: 'Mobile panel – slide from'
    description: 'Slide direction of the mobile panel on NavTop. Has no effect on NavLeft (always left) or NavRight (always right).'
    type: string
    default: 'offcanvas-end'
    category: conn.navbar.top
    enum:
      offcanvas-end: 'Right'
      offcanvas-start: 'Left'
      offcanvas-top: 'Top'
      offcanvas-bottom: 'Bottom'

  navbar.mobilePanelAlign:
    label: 'Panel – alignment (mobile)'
    description: 'Content alignment inside the panel at mobile / full-screen size.'
    type: string
    default: 'start'
    category: conn.navbar.panel
    enum:
      start: 'Left'
      center: 'Center'
      end: 'Right'

  navbar.desktopPanelAlign:
    label: 'Panel – alignment (desktop)'
    description: 'Content alignment inside the panel once it becomes a sidebar at the panel breakpoint. Leave empty to use the same alignment as mobile.'
    type: string
    default: ''
    category: conn.navbar.panel
    enum:
      '': 'Same as mobile'
      start: 'Left'
      center: 'Center'
      end: 'Right'

  navbar.panelTopContent:
    label: 'Panel – top content'
    description: 'Content shown above the navigation list in the panel.'
    type: string
    default: ''
    category: conn.navbar.panel
    enum:
      '': 'None'
      social: 'Social media links'
      contact: 'Contact (email & phone)'
      address: 'Full address'

  navbar.panelBottomContent:
    label: 'Panel – bottom content'
    description: 'Content shown below the navigation list in the panel.'
    type: string
    default: 'social'
    category: conn.navbar.panel
    enum:
      '': 'None'
      social: 'Social media links'
      contact: 'Contact (email & phone)'
      address: 'Full address'

  navbar.offcanvasScroll:
    label: 'Allow body scrolling'
    description: 'Allow the page to scroll while the panel is open.'
    type: bool
    default: false
    category: conn.navbar.panel

  navbar.offcanvasBackdrop:
    label: 'Backdrop'
    type: string
    default: 'true'
    category: conn.navbar.panel
    enum:
      'true': 'Show backdrop'
      'false': 'No backdrop'
      static: 'Static (click outside does not close)'

  # ─── Theme toggle ────────────────────────────────────────────────────────
  themeToggle.enabled:
    label: 'Theme toggle – show button'
    description: 'Show the light/dark theme toggle button. Disable to remove it from the navbar and footer.'
    type: bool
    default: false
    category: conn.themetoggle

  themeToggle.position:
    label: 'Theme toggle – fixed position'
    description: 'Show a floating theme toggle button at a fixed screen position. "None" keeps only the inline button in the navbar.'
    type: string
    default: ''
    category: conn.themetoggle
    enum:
      '': 'None (inline in navbar only)'
      bottom-right: 'Bottom right'
      bottom-left: 'Bottom left'
      top-right: 'Top right'
      top-left: 'Top left'

  themeToggle.offsetX:
    label: 'Theme toggle – horizontal offset (px)'
    description: 'Distance in pixels from the left or right screen edge.'
    type: int
    default: 24
    category: conn.themetoggle

  themeToggle.offsetY:
    label: 'Theme toggle – vertical offset (px)'
    description: 'Distance in pixels from the top or bottom screen edge.'
    type: int
    default: 24
    category: conn.themetoggle

  # ─── Branding ─────────────────────────────────────────────────────────────
  branding.logo:
    label: 'Logo – light mode'
    description: 'EXT: path (e.g. EXT:conn_base/Resources/Public/Icons/logo.svg) or full URL (https://…). Leave empty to show the site title as text.'
    type: string
    default: ''
    category: conn.branding

  branding.logoDark:
    label: 'Logo – dark mode'
    description: 'Alternate logo for dark mode. Same format as the light logo. Falls back to the light logo when empty.'
    type: string
    default: ''
    category: conn.branding

  branding.logoAlt:
    label: 'Logo alt text'
    description: 'Alt text for the logo image. Defaults to the site title when empty.'
    type: string
    default: ''
    category: conn.branding

  branding.logoWidth:
    label: 'Logo width (px)'
    description: 'Optional. Leave empty to scale automatically from the height (or from the image itself if both are empty).'
    type: int
    default: 0
    category: conn.branding

  branding.logoHeight:
    label: 'Logo height (px)'
    description: 'Optional. Leave empty to scale automatically from the width (or from the image itself if both are empty).'
    type: int
    default: 0
    category: conn.branding

  # ─── Footer – General ─────────────────────────────────────────────────────
  footer.layout:
    label: 'Footer layout'
    type: string
    default: 'Standard'
    category: conn.footer
    enum:
      Standard: 'Standard (brand + columns)'
      Centered: 'Centered'
      Minimal: 'Minimal (bar only)'

  # ─── Footer – Bottom bar ─────────────────────────────────────────────────
  footer.bar.show:
    label: 'Show bottom bar'
    type: bool
    default: true
    category: conn.footer.bar

  footer.bar.left:
    label: 'Bottom bar – Left slot'
    type: string
    default: 'copyright'
    category: conn.footer.bar
    enum:
      copyright: 'Copyright'
      social: 'Social links'
      navigation: 'Navigation (inline)'
      brand: 'Brand'
      brandTagline: 'Brand & tagline'
      tagline: 'Tagline'
      '': 'Empty'

  footer.bar.center:
    label: 'Bottom bar – Center slot'
    type: string
    default: ''
    category: conn.footer.bar
    enum:
      copyright: 'Copyright'
      social: 'Social links'
      navigation: 'Navigation (inline)'
      brand: 'Brand'
      brandTagline: 'Brand & tagline'
      tagline: 'Tagline'
      '': 'Empty'

  footer.bar.right:
    label: 'Bottom bar – Right slot'
    type: string
    default: 'social'
    category: conn.footer.bar
    enum:
      copyright: 'Copyright'
      social: 'Social links'
      navigation: 'Navigation (inline)'
      brand: 'Brand'
      brandTagline: 'Brand & tagline'
      tagline: 'Tagline'
      '': 'Empty'

  footer.bar.leftMobileAlign:
    label: 'Bottom bar – Left slot text alignment (mobile, <768px)'
    type: string
    default: ''
    category: conn.footer.bar
    enum:
      '': 'Left'
      'text-center': 'Center'
      'text-end': 'Right'

  footer.bar.centerMobileAlign:
    label: 'Bottom bar – Center slot text alignment (mobile, <768px)'
    type: string
    default: 'text-center'
    category: conn.footer.bar
    enum:
      '': 'Left'
      'text-center': 'Center'
      'text-end': 'Right'

  footer.bar.rightMobileAlign:
    label: 'Bottom bar – Right slot text alignment (mobile, <768px)'
    type: string
    default: ''
    category: conn.footer.bar
    enum:
      '': 'Left'
      'text-center': 'Center'
      'text-end': 'Right'

  # ─── Footer – Grid columns ───────────────────────────────────────────────
  footer.col1.content:
    label: 'Column 1 – Content'
    type: string
    default: 'brand'
    category: conn.footer.grid
