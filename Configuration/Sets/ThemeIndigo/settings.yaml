# ── Indigo ─────────────────────────────────────────────────────────────────
# Theme settings only — logos stay project-specific (branding.*, footer.logo*).
# Close to the connetation/t3wtk-base defaults (which are indigo-tinted): only accents are set.

theme.light.accent: '#6366f1'
theme.light.accentHover: '#4f46e5'
theme.accentSecondary: '#a855f7'
theme.light.link: '#4f46e5'
# Eyebrows are small text: the accent is below WCAG AA (4.5:1) on the page background
theme.light.eyebrow: '#4f46e5'
theme.light.btnBg: '#6366f1'
theme.light.btnBgHover: '#4f46e5'
theme.light.btnColor: '#ffffff'
theme.dark.accent: '#818cf8'
theme.dark.accentHover: '#a5b4fc'
theme.dark.link: '#a5b4fc'
theme.dark.btnBg: '#6366f1'
theme.dark.btnBgHover: '#818cf8'
theme.dark.btnColor: '#ffffff'
theme.linkHoverEffect: true
themeToggle.enabled: true
themeToggle.position: bottom-right

# Navigation: horizontal, right aligned, grid dropdowns
navbar.style: NavTop
navbar.position: sticky-top
navbar.alignment: end
navbar.logoPosition: left
navbar.navigationLevels: 2
navbar.topDropdownStyle: grid
navbar.panelTopContent: contact

# Footer: brand + tagline as a full-width row, then 3 columns
footer.layout: Standard
footer.showSocial: true
footer.col1.content: brand
footer.col2.content: navigation
footer.col3.content: address
footer.col4.content: social
footer.col1.width: '12'
footer.col2.width: '4,,12'
footer.col3.width: '4,,12'
footer.col4.width: '4,,12'
# Alignment: brand row centered, then navigation left, address centered, social right and at the bottom
footer.col1.align: 'center,,start'
footer.col2.align: start
footer.col3.align: 'center,,start'
footer.col4.align: 'end,,start'
footer.col4.valign: 'end,,start'
footer.col1.valign: start
footer.col2.valign: start
footer.col3.valign: start
footer.bar.col1.content: copyright
footer.bar.col2.content: ''
footer.bar.col3.content: navigation
# Bottom bar alignment pinned (the t3wtk-base defaults follow a different layout)
footer.bar.col1.align: start
footer.bar.col2.align: 'center,,start'
footer.bar.col3.align: 'end,,start'
