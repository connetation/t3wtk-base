<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default" />
<f:section name="Main">

    <f:comment>
        Overrides fluid_styled_content's Text template only to wrap the
        bodytext in .ce-bodytext (as Textmedia/Textpic already do), so RTE
        flow styles in _typography.scss apply regardless of frame_class.
    </f:comment>
    <div class="ce-bodytext">
        {record -> f:render.text(field: 'bodytext')}
    </div>

</f:section>
</html>
