<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:n="http://typo3.org/ns/GeorgRinger/News/ViewHelpers"
      data-namespace-typo3-fluid="true">
<f:layout name="General" />

<f:section name="content">
    <div class="news-search-result">
        <f:if condition="{search}">
            <f:if condition="{news}">
                <f:then>
                    <p class="count-msg">
                        <f:translate key="search-text" arguments="{0:'{f:count(subject:news)}',1:search.subject}" extensionName="News"/>
                    </p>
                    <f:if condition="{settings.search.paginate.insertAbove}">
                        <f:render partial="List/Pagination" arguments="{pagination: pagination.pagination, paginator: pagination.paginator}" />
                    </f:if>
                    <f:render partial="List/Items" arguments="{items: pagination.paginator.paginatedItems, settings: settings}" />
                    <f:if condition="{settings.search.paginate.insertBelow}">
                        <f:render partial="List/Pagination" arguments="{pagination: pagination.pagination, paginator: pagination.paginator}" />
                    </f:if>
                </f:then>
                <f:else>
                    <div class="alert alert-info">
                        <f:translate key="search-noresult" extensionName="News"/>
                    </div>
                </f:else>
            </f:if>
        </f:if>
    </div>
</f:section>
</html>
