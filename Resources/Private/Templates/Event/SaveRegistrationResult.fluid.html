<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<f:layout name="Default" />

<f:comment>conn_base override of derhansen/sf_event_mgt's Templates/Event/SaveRegistrationResult.fluid.html — Bootstrap alert + button.</f:comment>
<f:section name="main">
    <h1 class="mb-3"><f:translate domain="sf_event_mgt.messages" key="{titleKey}" /></h1>
    <div class="alert alert-info">
        <f:translate domain="sf_event_mgt.messages" key="{messageKey}" />
    </div>

    <f:if condition="{settings.listPid}">
        <f:link.action action="list" pageUid="{settings.listPid}" class="btn btn-outline-primary"><f:translate domain="sf_event_mgt.messages" key="event.backtext" /></f:link.action>
    </f:if>
</f:section>

</html>
