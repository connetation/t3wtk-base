<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:if condition="{data.imagewidth} || {data.imageheight}">
    <f:then>
        <f:image class="image-embed-item" image="{file}" width="{data.imagewidth}" height="{data.imageheight}" alt="{file.alternative}" title="{file.title}" loading="{settings.media.lazyLoading}" decoding="{settings.media.imageDecoding}" />
    </f:then>
    <f:else>
        <f:variable name="srcset" value="" />
        <f:variable name="separator" value="" />
        <f:for each="{0: 480, 1: 768, 2: 1024, 3: 1440, 4: 1920}" as="candidateWidth">
            <f:if condition="{candidateWidth} < {file.properties.width}">
                <f:variable name="srcset">{srcset}{separator}{f:uri.image(image: file, width: candidateWidth)} {candidateWidth}w</f:variable>
                <f:variable name="separator">, </f:variable>
            </f:if>
        </f:for>
        <f:if condition="{srcset}">
            <f:then>
                <f:image class="image-embed-item" image="{file}" width="1280" alt="{file.alternative}" title="{file.title}" loading="{settings.media.lazyLoading}" decoding="{settings.media.imageDecoding}" additionalAttributes="{srcset: srcset, sizes: sizes}" />
            </f:then>
            <f:else>
                <f:image class="image-embed-item" image="{file}" alt="{file.alternative}" title="{file.title}" loading="{settings.media.lazyLoading}" decoding="{settings.media.imageDecoding}" />
            </f:else>
        </f:if>
    </f:else>
</f:if>
</html>
