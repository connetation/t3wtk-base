<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:conn="http://typo3.org/ns/Connetation/Base/ViewHelpers"
      data-namespace-typo3-fluid="true">
<f:variable name="videoId"><conn:videoId url="{file.publicUrl}" /></f:variable>
<figure class="video"{f:if(condition: '{data.imagewidth} || {data.imageheight}', then: ' style="width: {dimensions.width}px;"')}>
    <a href="{file.publicUrl}"
       class="glightbox"
       data-autoplay="{file.properties.autoplay}"
       data-title="{file.title}"
       data-description="{file.description}">
        <div class="video-thumb">
            <f:switch expression="{file.originalFile.extension}">
                <f:case value="youtube">
                    <img src="https://img.youtube.com/vi/{videoId}/hqdefault.jpg"
                         alt="{file.alternative}" class="video-thumb-img" loading="lazy" />
                </f:case>
                <f:case value="vimeo">
                    <img src="https://vumbnail.com/{videoId}.jpg"
                         alt="{file.alternative}" class="video-thumb-img" loading="lazy" />
                </f:case>
                <f:defaultCase>
                    <video muted playsinline preload="metadata" class="video-thumb-img video-thumb-video">
                        <source src="{file.publicUrl}" type="{file.originalFile.mimeType}" />
                    </video>
                </f:defaultCase>
            </f:switch>
            <span class="video-thumb-play" aria-hidden="true"></span>
        </div>
    </a>
    <f:if condition="{file.description}">
        <figcaption class="video-caption">
            {file.description -> f:format.nl2br()}
        </figcaption>
    </f:if>
</figure>
</html>
