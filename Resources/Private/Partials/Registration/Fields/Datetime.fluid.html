<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:e="http://typo3.org/ns/DERHANSEN/SfEventMgt/ViewHelpers"
      data-namespace-typo3-fluid="true">
<div class="mb-3">
    <label class="form-label" for="{field.uid}">
        {field.title}
        <e:registration.isRequiredField settings="{settings}" registrationField="{field}">
            <span class="text-danger">*</span>
        </e:registration.isRequiredField>
    </label>
    <f:form.textfield type="{field.datepickermodeType}" id="{field.uid}" property="fields.{field.uid}" value="{e:registration.field.prefillField(registrationField: field)}" placeholder="{field.placeholder}" class="form-control {e:validation.errorClass(registrationField: field, class: 'is-invalid')}" />
    <f:render partial="FormErrors" arguments="{field: 'registration.fields.{field.uid}'}"/>
</div>
</html>
