<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:e="http://typo3.org/ns/DERHANSEN/SfEventMgt/ViewHelpers"
      data-namespace-typo3-fluid="true">
<f:comment>conn_base override of derhansen/sf_event_mgt's Partials/Registration/Fields/Select.fluid.html — Bootstrap 5 form-select styling.</f:comment>
<div class="mb-3">
    <label class="form-label">
        {field.title}
        <e:registration.isRequiredField settings="{settings}" registrationField="{field}">
            <span class="text-danger">*</span>
        </e:registration.isRequiredField>
    </label>
    <f:form.select id="{field.uid}" property="fields.{field.uid}" class="form-select {e:validation.errorClass(registrationField: field, class: 'is-invalid')}">
        <f:for each="{field.settingsForOption}" as="option">
            <f:if condition="{e:registration.field.prefillMultiValueField(registrationField: field, currentValue: option.value)}">
                <f:then>
                    <option value="{option.value}" selected>{option.label}</option>
                </f:then>
                <f:else>
                    <option value="{option.value}">{option.label}</option>
                </f:else>
            </f:if>
        </f:for>
    </f:form.select>
    <f:render partial="FormErrors" arguments="{field: 'registration.fields.{field.uid}'}"/>
</div>
</html>
