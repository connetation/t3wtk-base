<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">
<f:if condition="{data.header_layout} != 100">
    <f:if condition="{data.header} || {data.subheader} || {data.date}">
        <header>
            <f:if condition="{data.header}">
                <f:comment>header_layout 0 = "Default" resolves to the site setting
                     styles.content.defaultHeaderType (fsc convention, mapped into
                     {settings.defaultHeaderType} by lib.contentElement).</f:comment>
                <f:variable name="headerLayout" value="{data.header_layout}" />
                <f:if condition="!{headerLayout} && {settings.defaultHeaderType}">
                    <f:variable name="headerLayout" value="{settings.defaultHeaderType}" />
                </f:if>
                <f:switch expression="{headerLayout}">
                    <f:case value="1"><h1 class="{positionClass}"><f:link.typolink parameter="{data.header_link}">{data.header}</f:link.typolink></h1></f:case>
                    <f:case value="2"><h2 class="{positionClass}"><f:link.typolink parameter="{data.header_link}">{data.header}</f:link.typolink></h2></f:case>
                    <f:case value="3"><h3 class="{positionClass}"><f:link.typolink parameter="{data.header_link}">{data.header}</f:link.typolink></h3></f:case>
                    <f:case value="4"><h4 class="{positionClass}"><f:link.typolink parameter="{data.header_link}">{data.header}</f:link.typolink></h4></f:case>
                    <f:case value="5"><h5 class="{positionClass}"><f:link.typolink parameter="{data.header_link}">{data.header}</f:link.typolink></h5></f:case>
                    <f:case value="6"><h6 class="{positionClass}"><f:link.typolink parameter="{data.header_link}">{data.header}</f:link.typolink></h6></f:case>
                    <f:defaultCase><h2 class="{positionClass}"><f:link.typolink parameter="{data.header_link}">{data.header}</f:link.typolink></h2></f:defaultCase>
                </f:switch>
            </f:if>
            <f:if condition="{data.subheader}">
                <p class="ce-subheader {positionClass}">{data.subheader}</p>
            </f:if>
        </header>
    </f:if>
</f:if>
</html>
