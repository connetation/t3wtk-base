<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">
<f:if condition="{site.settings.footer.address.email} || {site.settings.footer.address.phone}">
<div class="conn-panel-contact">
    <f:if condition="{site.settings.footer.address.email}">
        <a href="mailto:{site.settings.footer.address.email}">{site.settings.footer.address.email}</a>
    </f:if>
    <f:if condition="{site.settings.footer.address.phone}">
        <a href="tel:{site.settings.footer.address.phone}">{site.settings.footer.address.phone}</a>
    </f:if>
</div>
</f:if>
</html>
