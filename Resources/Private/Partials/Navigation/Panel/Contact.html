<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:conn="http://typo3.org/ns/Connetation/T3kitBase/ViewHelpers"
      data-namespace-typo3-fluid="true">
<f:if condition="{site.settings.contact.email} || {site.settings.contact.phone}">
<div class="conn-panel-contact">
    <f:if condition="{site.settings.contact.phone}">
        <a href="tel:{conn:sanitizePhoneForDialing(value: site.settings.contact.phone)}">
            <f:if condition="{site.settings.contact.phoneIcon}">
                <img src="{conn:resolvePath(path: site.settings.contact.phoneIcon)}" alt="" aria-hidden="true" class="conn-panel-contact__icon" />
            </f:if>
            {site.settings.contact.phone}
        </a>
    </f:if>
    <f:if condition="{site.settings.contact.email}">
        <a href="mailto:{site.settings.contact.email}">
            <f:if condition="{site.settings.contact.emailIcon}">
                <img src="{conn:resolvePath(path: site.settings.contact.emailIcon)}" alt="" aria-hidden="true" class="conn-panel-contact__icon" />
            </f:if>
            {site.settings.contact.email}
        </a>
    </f:if>
</div>
</f:if>
</html>
